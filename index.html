function geminiInterestModelCandidates(){const primary=getGeminiModel('interest');return Array.from(new Set([primary,'gemini-2.0-flash','gemini-2.5-flash'].filter(Boolean)))}
const GEMINI_TEMPORARY_ERROR_MESSAGE='AI 서버가 일시적으로 혼잡합니다.\n잠시 후 다시 시도해 주세요.';
const GEMINI_RATE_LIMIT_ERROR_MESSAGE='AI 사용량이 일시적으로 많습니다. 잠시 후 다시 시도해 주세요.';
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function isGeminiRetryableError(err){const msg=String(err?.message||err||'').toLowerCase();return err?.status===503||err?.isNetworkError||err instanceof TypeError||msg.includes('failed to fetch')||msg.includes('network')}
async function fetchGeminiWithRetry(url,options){const delays=[5000,10000,20000];let lastErr=null;for(let attempt=0;attempt<=delays.length;attempt++){try{const res=await fetch(url,options);if(res.status===429){console.error('Gemini API 사용량 제한 오류:',await res.clone().json().catch(()=>({status:res.status,statusText:res.statusText})));const friendly=new Error(GEMINI_RATE_LIMIT_ERROR_MESSAGE);friendly.status=429;friendly.isGeminiRateLimit=true;throw friendly}if(res.status===503){const err=new Error(`Gemini API 오류 (${res.status})`);err.status=res.status;throw err}return res}catch(err){lastErr=err;if(err instanceof TypeError)err.isNetworkError=true;console.error('Gemini API 호출 오류:',err);if(err?.isGeminiRateLimit)throw err;if(!isGeminiRetryableError(err)||attempt===delays.length){if(isGeminiRetryableError(err)){const friendly=new Error(GEMINI_TEMPORARY_ERROR_MESSAGE);friendly.cause=lastErr;friendly.isGeminiTemporaryFailure=true;throw friendly}throw err}await wait(delays[attempt])}}}
function isGeminiTemporaryBusy(err){const msg=String(err?.message||err||'').toLowerCase();return msg.includes('high demand')||msg.includes('overloaded')||msg.includes('try again later')||msg.includes('resource_exhausted')||msg.includes('unavailable')||msg.includes('503')}
async function requestGeminiInterestReport(apiKey,model,parts){const res=await fetchGeminiWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:.12,topP:.65}})});const data=await res.json().catch(()=>({}));if(!res.ok){const msg=data?.error?.message||`Gemini API 오류 (${res.status})`;const err=new Error(msg);err.status=res.status;throw err}const text=(data?.candidates?.[0]?.content?.parts||[]).map(part=>part.text||'').join('\n').trim();if(!text)throw new Error('Gemini 응답에서 리포트 내용을 찾지 못했습니다.');return text}
generateGeminiInterestReport=async function(p,target,hasTarget){const apiKey=val('interestApiKey');const memo=val('interestMemo');if(!apiKey)throw new Error('Gemini API 키를 입력해주세요.');const manualData=collectInterestManualData(hasTarget,target);localStorage.setItem('GEMINI_API_KEY',apiKey);const btn=document.getElementById('interestButton');const oldText=btn?btn.textContent:'';if(btn){btn.disabled=true;btn.textContent='리포트 생성 중...'}try{const parts=[{text:manualInterestPromptText(p,target,memo,manualData,hasTarget)}];let lastErr=null;for(const model of geminiInterestModelCandidates()){try{if(btn)btn.textContent='리포트 생성 중...';const text=await requestGeminiInterestReport(apiKey,model,parts);return{title:`${manualData.personalInfo.name} 직업선호도검사 리포트`,html:cleanGeminiHtml(text),participantName:manualData.personalInfo.name}}catch(err){lastErr=err;if(!isGeminiTemporaryBusy(err))throw err}}throw new Error('현재 Gemini 모델 사용량이 많아 리포트를 생성하지 못했습니다. 자동으로 다른 모델까지 재시도했지만 모두 혼잡합니다. 잠시 후 다시 시도해주세요.')}finally{if(btn){btn.disabled=false;btn.textContent=oldText||'직업선호도검사 리포트 생성'}}}
function sortedScoreEntries(obj){return Object.entries(obj||{}).sort((a,b)=>Number(b[1])-Number(a[1]))}
function scorePhrase(entries,n=2){return entries.slice(0,n).map(([k,v])=>`${escapeHtml(k)} ${escapeHtml(v)}점`).join(', ')}
function personalInfoHtml(data){const p=data.personalInfo;const fields=[['이름',p.name],['나이',p.age],['학력',p.education],['전공',p.major],['결혼',p.marriage],['생활수준',p.livingLevel],['현직업',p.currentJob],['직위',p.position],['근무연수',p.workYears],['회사변경횟수',p.companyChanges],['직업변경횟수',p.jobChanges],['자격증',p.certificates]].filter(([,v])=>String(v||'').trim());return `<div class="summary-box">${fields.map(([k,v])=>`<p><strong>${escapeHtml(k)}:</strong> ${escapeHtml(v)}</p>`).join('')}</div>`}
function localInterestFacts(data){const interest=sortedScoreEntries(data.interestRaw);const life=hasInterestValues(data.lifeHistory)?sortedScoreEntries(data.lifeHistory):[];const rel=hasInterestValues(data.reliability)?data.reliability:{};const relNotes=Object.entries(rel).map(([k,v])=>`${k} ${v.score}점${v.criterion==='제공되지 않음'?' / 기준 제공되지 않음':' / 기준 '+v.criterion+'점'}`).join(', ')||'미입력';return{interestTop:scorePhrase(interest,3),interestLow:scorePhrase(interest.slice().reverse(),2),lifeTop:life.length?scorePhrase(life,3):'미입력',lifeLow:life.length?scorePhrase(life.slice().reverse(),2):'미입력',reliability:relNotes}}
function localInterestFallbackSections(data,hasTarget,target){const f=localInterestFacts(data);const hasPersonality=hasInterestValues(data.personality);const hasLife=hasInterestValues(data.lifeHistory);const hasReliability=hasInterestValues(data.reliability);const relCautions=hasReliability?Object.entries(data.reliability).filter(([,v])=>v.criterion!=='제공되지 않음'&&Number(v.score)>=Number(v.criterion)).map(([k])=>k):[];const personalityNote=hasPersonality?'성격검사 결과는 직업흥미 점수를 단독으로 해석하지 않도록 보완하는 자료입니다. 입력된 성격 세부 점수만 사용해 선호 활동이 실제 일하는 방식과 맞는지 점검해야 합니다.':'성격검사 결과는 미입력입니다. 따라서 성격 특성을 임의로 추정하지 않고, 직업흥미검사 원점수와 인적사항, 상담사 메모에 근거해 해석합니다.';const lifeText=hasLife?`<p>생활사검사에서 상대적으로 높은 지표는 ${f.lifeTop}이고, 낮은 지표는 ${f.lifeLow}입니다. 이 결과는 직업흥미와 별개로 내담자가 오래 버틸 수 있는 환경, 관계 방식, 성취 동기를 파악하는 데 활용합니다.</p><p>${hasTarget?`희망 직무인 ${escapeHtml(target)}는 흥미 원점수의 상위 영역과 입력된 생활사 상위 지표가 실제 업무 장면에서 만나는지를 중심으로 검토해야 합니다.`:'희망 직무가 없으므로 상위 흥미 영역과 입력된 생활사 상위 지표가 동시에 살아나는 직무군을 우선 탐색하는 것이 좋습니다.'}</p>`:`<p>생활사검사 결과는 미입력입니다. 가족, 경제, 대인관계, 성취경험 등 생활사 지표는 추정하지 않고, 직업흥미검사 원점수에서 확인되는 선호 활동을 중심으로 1차 진로 가설을 세웁니다.</p><p>${hasTarget?`희망 직무인 ${escapeHtml(target)}와의 적합도는 입력된 흥미 원점수와 상담사 메모를 기준으로만 검토합니다.`:'희망 직무가 없으므로 입력된 흥미 원점수에서 출발해 상담 과정에서 생활 조건과 지속 가능성을 추가 확인합니다.'}</p>`;return{interest:`<h2>직업흥미${hasPersonality?'와 성격':' 중심'} 해석</h2><p>직업흥미 원점수에서 상대적으로 높은 영역은 ${f.interestTop}입니다. 이 조합은 내담자가 어떤 활동에 자연스럽게 에너지를 쓰는지 확인하는 출발점으로 볼 수 있습니다. 낮은 영역은 ${f.interestLow}이므로, 해당 활동을 무조건 배제하기보다 실제 직무 안에서 차지하는 비중을 확인하는 방식이 적절합니다.</p><p>${personalityNote}</p>`,life:`<h2>생활사와 커리어 맥락 분석</h2>${lifeText}`,questions:`<h2>상담사용 핵심 질문 10가지</h2><ol><li>최근 일이나 활동 중 시간이 가장 빨리 지나갔다고 느낀 순간은 언제였나요?</li><li>반대로 에너지가 빠르게 소진된 업무나 관계 장면은 무엇이었나요?</li><li>상위 흥미 영역이 실제 직업 선택에서 얼마나 중요하다고 느끼나요?</li><li>현재 삶의 조건에서 절대 포기하기 어려운 근무 조건은 무엇인가요?</li><li>성과를 냈지만 다시 하고 싶지 않은 일은 무엇이었나요?</li><li>실패 가능성이 낮다면 새롭게 시도해보고 싶은 직무나 역할은 무엇인가요?</li><li>사람, 자료, 아이디어, 실행 중 어디에 가장 오래 집중할 수 있나요?</li><li>가족, 경제, 건강, 지역 조건 중 진로 선택에 가장 큰 영향을 주는 것은 무엇인가요?</li><li>지금까지의 경력에서 다음 직무로 가져가고 싶은 async function requestGeminiInterestSegment(apiKey,scope,data,hasTarget,target){const parts=[{text:interestSegmentPrompt(scope,data,hasTarget,target)}];for(const model of geminiInterestModelCandidates()){try{return cleanGeminiHtml(await requestGeminiInterestReport(apiKey,model,parts))}catch(err){if(!isGeminiTemporaryBusy(err))throw err}}throw new Error('busy')}
async function safeGeminiInterestSegment(apiKey,scope,data,hasTarget,target,fallback){if(!apiKey)return fallback;try{return await requestGeminiInterestSegment(apiKey,scope,data,hasTarget,target)}catch(err){if(err?.isGeminiTemporaryFailure||err?.isGeminiRateLimit)throw err;return fallback}}
function interestTargetMockFormatSections(data,sections){const f=localInterestFacts(data);const target=escapeHtml(data.target);const top=sortedScoreEntries(data.interestRaw);const topName=top[0]?.[0]||'상위 흥미';const lowName=top.slice().reverse()[0]?.[0]||'낮은 흥미';const hasPersonality=hasInterestValues(data.personality);const hasLife=hasInterestValues(data.lifeHistory);const jobs=['HR 데이터 분석가','전직지원 컨설턴트','에듀테크 교육과정 기획자','직업능력개발훈련 심사평가원','공공기관 정부위탁사업 운영 PM','리서치 연구원 / 시장조사 분석가','기업 사내교육 L&D 운영 전문가','AI 학습 데이터 매니저','인사 및 노무 사무원','대학 학사행정 / 교육행정 전문가'];const saramin=job=>`https://www.saramin.co.kr/zf_user/search?searchword=${encodeURIComponent(job)}`;return `<h2>내담자를 위한 한 줄 메세지</h2><ul><li>${target}로 향하는 길은 이미 가진 강점에서 시작됩니다.</li><li>${escapeHtml(topName)} 흥미는 일을 오래 지속하게 만드는 중요한 에너지입니다.</li><li>검사 결과를 기준으로 강점은 살리고 보완점은 작게 훈련하면 됩니다.</li><li>지금 필요한 것은 확신보다 검증 가능한 다음 행동입니다.</li></ul><h2>희망직무 맞춤형 SWOT 분석</h2><table><tbody><tr><th>Strengths 강점</th><th>Weaknesses 약점</th></tr><tr><td>${target}와 연결 가능한 ${escapeHtml(topName)} 중심 강점<br>입력 점수를 기준으로 한 체계적 자기이해</td><td>${escapeHtml(lowName)} 활동 비중이 큰 업무에서는 피로 가능성<br>미입력 검사 영역은 추가 상담으로 확인 필요</td></tr><tr><th>Opportunities 기회</th><th>Threats 위협</th></tr><tr><td>AI 도구와 직무 데이터 활용으로 준비 과정을 구체화 가능<br>채용공고 비교를 통해 실제 과업 적합도 확인 가능</td><td>직무명만 보고 선택하면 실제 과업과 불일치할 수 있음<br>단순 반복 업무는 자동화 영향을 받을 수 있음</td></tr></tbody></table><h2>내담자의 희망직무와 맞는 역량 분석</h2>${sections.interest}${sections.life}<p>${target} 적합도는 입력된 직업흥미 원점수${hasPersonality?', 성격검사':''}${hasLife?', 생활사검사':''}와 상담사 메모를 근거로 검토합니다. 성격검사나 생활사검사가 미입력인 경우에는 해당 영역을 추정하지 않고 추가 확인 과제로 남깁니다.</p><h2>저출산 · 고령화 시대의 전망</h2><p>인구구조 변화로 경력 전환, 재교육, 고용서비스, 조직 내 역량관리의 중요성이 커지고 있습니다. ${target} 역시 실제 과업이 사람의 경험과 조직의 필요를 연결하는 방향이라면 중장기적으로 탐색 가치가 있습니다.</p><h2>AI · 디지털 전환 시대의 전망</h2><p>AI가 반복적인 자료 입력과 단순 문서작업을 대체할수록, 검사 결과를 해석하고 사람에게 맞는 실행계획으로 바꾸는 역량이 중요해집니다. 내담자는 ${escapeHtml(topName)} 강점을 디지털 도구 활용, 자료 구조화, 업무 기준 정리와 결합해 경쟁력을 높일 수 있습니다.</p><h2>총평 및 내담자 맞춤형 전략 제시</h2><p>${target}를 바로 확정하기보다 실제 채용공고 3개 이상을 비교해 반복 과업, 요구역량, 근무환경을 확인하는 방식이 적절합니다. 이후 본인의 경험을 직무 요구사항과 연결하는 포트폴리오 문장으로 정리하면 상담 이후 실행력이 높아집니다.</p><h2>검사 결과 기반 추천 직업 10개</h2><table><thead><tr><th>직업</th><th>추천 근거</th><th>준비 과제</th><th>채용공고</th></tr></thead><tbody>${jobs.map(job=>`<tr><td>${escapeHtml(job)}</td><td>${escapeHtml(f.interestTop)}와 연결 가능한 직무군입니다.</td><td>채용공고의 반복 과업과 현재 경험의 연결 문장을 정리합니다.</td><td><a href="${saramin(job)}" target="_blank" rel="noopener">사람인 검색</a></td></tr>`).join('')}</tbody></table>${sections.questions}`}
function composeLocalInterestReport(data,sections){const f=localInterestFacts(data);const hasPersonality=hasInterestValues(data.personality);const hasLife=hasInterestValues(data.lifeHistory);const base=`<h1>${escapeHtml(data.personalInfo.name)} 직업선호도검사 리포트</h1><h2>내담자 인적사항</h2>${personalInfoHtml(data)}${sections.notice||''}<h2>핵심 해석 기준</h2><p>이 리포트는 상담사가 직접 입력한 점수를 확정값으로 사용합니다. 직업흥미검사는 원점수 기준으로 해석하며, 미입력된 성격검사와 생활사검사는 임의로 추정하지 않습니다.</p><p><strong>흥미 상위 영역:</strong> ${f.interestTop}<br><strong>성격검사:</strong> ${hasPersonality?'입력 자료 반영':'미입력'}<br><strong>생활사 상위 지표:</strong> ${f.lifeTop}<br><strong>응답 신뢰성:</strong> ${escapeHtml(f.reliability)}</p>`;if(data.hasTarget)return base+interestTargetMockFormatSections(data,sections);return `${base}${sections.interest}${sections.life}<h2>상담 및 실행 방향</h2><p>희망 직무가 정해져 있지 않으므로 입력된 흥미 원점수를 출발점으로 직무군을 넓게 탐색하고, 상담 과정에서 ${hasLife?'생활 조건':'생활 조건과 지속 가능성'}을 추가 확인합니다.</p>${sections.questions}`}
generateGeminiInterestReport=async function(p,target,hasTarget){const apiKey=val('interestApiKey');const manualData=collectInterestManualData(hasTarget,target);if(apiKey)localStorage.setItem('GEMINI_API_KEY',apiKey);const btn=document.getElementById('interestButton');const oldText=btn?btn.textContent:'';if(btn){btn.disabled=true;btn.textContent='리포트 생성 중...'}try{const fallback=localInterestFallbackSections(manualData,hasTarget,target);if(btn)btn.textContent='리포트 생성 중...';const interest=await safeGeminiInterestSegment(apiKey,'interest',manualData,hasTarget,target,fallback.interest);if(btn)btn.textContent='리포트 생성 중...';const life=await safeGeminiInterestSegment(apiKey,'life',manualData,hasTarget,target,fallback.life);if(btn)btn.textContent='리포트 생성 중...';const questions=await safeGeminiInterestSegment(apiKey,'questions',manualData,hasTarget,target,fallback.questions);const html=composeLocalInterestReport(manualData,{...fallback,interest,life,questions});return{title:`${manualData.personalInfo.name} 직업선호도검사 리포트`,html,participantName:manualData.personalInfo.name}}finally{if(btn){btn.disabled=false;btn.textContent=oldText||'직업선호도검사 리포트 생성'}}}
load();render();
</script>
