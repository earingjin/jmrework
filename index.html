<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RE:WORK</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div><div id="toast" class="toast"></div>
<script src="successData.js"></script>
<script src="successPrompt.js"></script>
<script src="contentData.js"></script>
<script src="reportRegistry.js"></script>
<script src="reportModules.js"></script>
<script src="aiGateway.js"></script>
<script src="reports/companyReportModule.js"></script>
<script src="reports/interestReportModule.js"></script>
<script src="reports/interviewReportModule.js"></script>
<script src="reports/seniorReportModule.js"></script>
<script src="reports/jobAnalysisReportModule.js"></script>
<script src="reports/successReportModule.js"></script>
<script src="landingpage.js"></script>
<script src="geminiPromptNoTarget.js"></script>
<script src="geminiPromptTarget.js"></script>

<script>
const LEGACY_STORAGE_KEY='ai_career_report_index_v2';
const ACCOUNT_STORAGE_KEY='ai_career_accounts_v1';
const DEVELOPMENT_MODE = new URLSearchParams(window.location.search).get('dev') === '1';
const BRAND_NAME = 'RE:WORK CENTER';
const BRAND_SUBTITLE = 'AI Career Solution';
const APP_ROLE='counselor';
const BRAND_LOGO = 'assets/brand-logo.png';
const DEFAULT_GEMINI_MODEL='gemini-2.5-flash';
window.AICareerReportConfig=window.AICareerReportConfig||{};
// TODO(security): 상용 배포 시 Gemini API 키를 프론트엔드 또는 localStorage에 저장하지 말고 서버 프록시에서 관리해야 합니다.
const GEMINI_API_KEY = window.AICareerReportConfig.geminiApiKey || '';
function getGeminiModel(scope='default'){const cfg=window.AICareerReportConfig||{};return cfg[`${scope}GeminiModel`]||cfg.geminiModel||localStorage.getItem('GEMINI_MODEL')||DEFAULT_GEMINI_MODEL}
window.setGeminiModel=function(model,scope='default'){if(!model)return;window.AICareerReportConfig=window.AICareerReportConfig||{};if(scope&&scope!=='default')window.AICareerReportConfig[`${scope}GeminiModel`]=model;else window.AICareerReportConfig.geminiModel=model;localStorage.setItem('GEMINI_MODEL',model)}

// ================= 화면 내용 관리 영역 =================
// 사이드바를 클릭했을 때 보이는 화면의 제목, 설명, 안내 문구는 여기서 수정합니다.
// 아래 문구만 바꾸면 연결된 화면 전체에 자동 반영됩니다.
function sc(section){return SCREEN_CONTENT[section]||{}}
function flowCardsHtml(){return (sc('dashboard').flowCards||[]).map(card=>`<div class="module-card"><h3>${escapeHtml(card.title)}</h3><p>${escapeHtml(card.desc)}</p></div>`).join('')}
function reportDefinition(type){return window.REPORT_REGISTRY?.get(type)||null}
function reportMenuDefinitions(){const hiddenSidebarReports=new Set(['task','interview']);return (window.REPORT_REGISTRY?.menuItems()||[]).filter(definition=>!hiddenSidebarReports.has(definition.id))}
function reportQuickDefinitions(){return window.REPORT_REGISTRY?.quickActions()||[]}
function moduleDescription(type){return reportDefinition(type)?.description||(sc('modules').moduleDesc||{})[type]||''}
const state={view:'landing',user:null,active:'dashboard',activeModule:'interest',selectedParticipantId:null,currentReport:null,editMode:false,reportMenuOpen:true,jobResults:[],lastJobQuery:null,history:[],data:{participants:[{id:'session_client',name:'내담자',age:'미저장',status:'검사결과 분석',docStatus:'미저장',target:'',career:'',memo:'',createdAt:today()}],reports:[]}};
function uid(){return'id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}function today(){return new Date().toISOString().slice(0,10)}function escapeHtml(str=''){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function normalizeAccountRole(role){const text=String(role||'').trim().toLowerCase();if(['상담사','counselor','user'].includes(text))return'상담사';if(['관리자','admin','administrator'].includes(text))return'관리자';return String(role||'').trim()}function reportBrandHeader(title='AI Career Solution Report'){return `<div class="report-brand-header"><img src="${BRAND_LOGO}" alt="${BRAND_NAME}" class="report-brand-logo"><div><div class="report-brand-text">${BRAND_SUBTITLE} Report</div><div class="report-brand-name">${escapeHtml(title)}</div></div></div>`}function withReportBrand(html,title='AI Career Solution Report'){if(!html)return html;if(String(html).includes('report-brand-header'))return html;return reportBrandHeader(title)+html}function storageDefaults(){return{participants:[{id:'session_client',name:'내담자',age:'미저장',status:'검사결과 분석',docStatus:'미저장',target:'',career:'',memo:'',createdAt:today()}],reports:[],jobMatches:[],accounts:[]}}
function load(){let savedAccounts=null;try{const accountData=JSON.parse(localStorage.getItem(ACCOUNT_STORAGE_KEY)||'null');const legacyData=JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY)||'null');savedAccounts=Array.isArray(accountData?.accounts)?accountData.accounts:Array.isArray(legacyData?.accounts)?legacyData.accounts:null}catch(err){savedAccounts=null}state.data=storageDefaults();if(savedAccounts)state.data.accounts=savedAccounts;localStorage.removeItem(LEGACY_STORAGE_KEY);ensureDefaults();state.selectedParticipantId=state.data.participants[0]?.id||'session_client';state.view='landing';persist()}
function ensureDefaults(){if(!Array.isArray(state.data.participants)||!state.data.participants.length)state.data.participants=storageDefaults().participants;if(!Array.isArray(state.data.reports))state.data.reports=[];if(!Array.isArray(state.data.jobMatches))state.data.jobMatches=[];if(!Array.isArray(state.data.accounts))state.data.accounts=[];state.data.accounts.forEach(a=>{a.role=normalizeAccountRole(a.role);if(a.isDemo===undefined&&((a.loginId==='counselor01'&&a.password==='1234'&&a.name==='상담사 데모')||(a.loginId==='admin'&&a.password==='admin123'&&a.name==='관리자')))a.isDemo=true});if(DEVELOPMENT_MODE&&!state.data.accounts.some(a=>a.isDemo===true&&normalizeAccountRole(a.role)==='관리자'))state.data.accounts.unshift({id:uid(),loginId:'admin',password:'admin123',name:'관리자',role:'관리자',isDemo:true,source:'development',createdAt:today()});if(!state.data.accounts.some(a=>a.isDemo===true&&normalizeAccountRole(a.role)==='상담사'))state.data.accounts.push({id:uid(),loginId:'counselor01',password:'1234',name:'상담사 데모',role:'상담사',isDemo:true,source:'demo',createdAt:today()});}
function persist(){localStorage.setItem(ACCOUNT_STORAGE_KEY,JSON.stringify({accounts:state.data.accounts||[]}));localStorage.removeItem(LEGACY_STORAGE_KEY);localStorage.setItem('GEMINI_API_KEY',localStorage.getItem('GEMINI_API_KEY')||'')}
function resetSensitiveSessionData(){const accounts=state.data.accounts||[];state.data={...storageDefaults(),accounts};state.selectedParticipantId=state.data.participants[0]?.id||'session_client';state.currentReport=null;state.editMode=false;state.jobResults=[];state.lastJobQuery=null;state.successResults=[];state.successQuery='';state.successInsight='';state.selectedSuccessCaseIds=[];state.selectedSuccessCaseId=null;state.history=[]}
function usageMetadataOnly(payload={}){const allowed=['reportType','durationMs','status','errorName','reason'];return Object.fromEntries(allowed.filter(key=>payload[key]!==undefined).map(key=>[key,payload[key]]))}
function recordUsageEvent(eventName,payload={}){const event={eventName,payload:usageMetadataOnly(payload),recordedAt:new Date().toISOString()};try{const key='ai_career_usage_events_v1';const events=JSON.parse(localStorage.getItem(key)||'[]');events.push(event);localStorage.setItem(key,JSON.stringify(events.slice(-300)))}catch(err){console.warn('사용 통계 임시 저장 실패',err)}console.log('[usage-event]',event);return event}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}function getParticipant(){return state.data.participants.find(p=>p.id===state.selectedParticipantId)||state.data.participants[0]||null}function reportTypeName(type){return reportDefinition(type)?.title||'리포트'}

function pageSnapshot(){return{view:state.view,user:state.user?{...state.user}:null,active:state.active,activeModule:state.activeModule,selectedParticipantId:state.selectedParticipantId,currentReport:state.currentReport?{...state.currentReport}:null,editMode:state.editMode,reportMenuOpen:state.reportMenuOpen,jobResults:Array.isArray(state.jobResults)?state.jobResults.map(x=>({...x})):[],lastJobQuery:state.lastJobQuery?{...state.lastJobQuery}:null};}
function pushHistory(){const snap=pageSnapshot();const last=state.history[state.history.length-1];if(!last||JSON.stringify(last)!==JSON.stringify(snap)){state.history.push(snap);if(state.history.length>40)state.history.shift();}}
function restoreSnapshot(snap){state.view=snap.view;state.user=snap.user;state.active=snap.active;state.activeModule=snap.activeModule;state.selectedParticipantId=snap.selectedParticipantId;state.currentReport=snap.currentReport;state.editMode=snap.editMode;state.reportMenuOpen=snap.reportMenuOpen;state.jobResults=snap.jobResults||[];state.lastJobQuery=snap.lastJobQuery||null;}
function goBack(){if(!state.history.length){toast('이전 페이지가 없습니다.');return}const snap=state.history.pop();restoreSnapshot(snap);render();}
function render(){const app=document.getElementById('app');if(state.view==='landing'){app.innerHTML=renderLanding();return}if(state.view==='login'&&!state.user){app.innerHTML=renderCounselorLogin();return}app.innerHTML=renderApp();activateSection(state.active)}
function renderLanding(){return landingTemplate()}
function renderCounselorLogin(){return loginTemplate()}
function renderApp(){return shellTemplate()}



function landingNavLinksHtml() {
  return LANDING_CONTENT.nav
    .map(item => `<a href="${item.href}">${item.label}</a>`)
    .join('');
}

function landingCheckListHtml(items) {
  return items.map(item => `<li>${item}</li>`).join('');
}

function landingChipRowHtml(items) {
  return items.map(item => `<span class="real-chip">${item}</span>`).join('');
}

function landingReportSectionHtml(report) {
  return `
    <section class="real-report-section" id="${report.id}">
      <div class="${report.layoutClass}">
        <div class="real-report-copy">
          <div class="kicker">${report.kicker}</div>
          <h2>${report.title}</h2>
          <p>${report.description}</p>
          <ul class="check-list">
            ${landingCheckListHtml(report.checks)}
          </ul>
          <div class="real-chip-row">
            ${landingChipRowHtml(report.chips)}
          </div>
        </div>
        <div class="real-report-image">
          <img src="${LANDING_IMAGES[report.imageKey]}" alt="${report.imageAlt}">
        </div>
      </div>
    </section>`;
}

function landingQualityCardsHtml() {
  return LANDING_CONTENT.quality.cards
    .map(card => `
      <div class="quality-card">
        <span class="num">${card.number}</span>
        <h3>${card.title}</h3>
        <p>${card.description}</p>
      </div>`)
    .join('');
}

function landingFeatureStripHtml() {
  return LANDING_CONTENT.featureStrip
    .map(item => `
      <div class="real-feature-item">
        <strong>${item.title}</strong>
        <span>${item.description}</span>
      </div>`)
    .join('');
}
function landingTemplate() {
  const content = LANDING_CONTENT;
  const reports = content.reports;

  return `
    <div class="landing pro-landing">
      <header class="landing-nav">
        <div class="logo">
          <img src="${BRAND_LOGO}" alt="${BRAND_NAME}" class="brand-logo landing-logo">
        </div>
        <nav class="landing-nav-links">
          ${landingNavLinksHtml()}
          <button class="btn" onclick="goLogin()">${content.buttons.login}</button>
        </nav>
      </header>

      <section class="real-hero">
        <div class="real-hero-inner">
          <div class="real-hero-copy">
            <span class="real-hero-badge">${content.hero.badge}</span>
            <h1>${content.hero.title}</h1>
            <p>${content.hero.description}</p>
            <div class="actions">
              <button class="btn" onclick="goLogin()">${content.buttons.start}</button>
              <a class="btn secondary" href="#company-report">${content.buttons.viewReport}</a>
            </div>
          </div>
          <div class="real-hero-image">
            <img src="${LANDING_IMAGES.hero}" alt="${content.hero.imageAlt}">
          </div>
        </div>
      </section>

      ${landingReportSectionHtml(reports.company)}
      ${landingReportSectionHtml(reports.success)}

      <section class="pro-section" id="${content.quality.id}">
        <div class="pro-section-header">
          <h2>${content.quality.title}</h2>
          <p>${content.quality.description}</p>
        </div>
        <div class="quality-grid">
          ${landingQualityCardsHtml()}
        </div>
      </section>

      <section class="real-feature-strip">
        ${landingFeatureStripHtml()}
      </section>

      <section class="landing-cta">
        <div>
          <h2>${content.cta.title}</h2>
          <p>${content.cta.description}</p>
        </div>
        <button class="btn secondary" onclick="goLogin()">${content.buttons.start}</button>
      </section>

      <footer class="landing-footer">
        <strong>${content.footer.brand}</strong><br>
        ${content.footer.description}
      </footer>
    </div>`;
}
function goLogin(){pushHistory();state.view='login';state.user=null;render()}
function goLanding(){pushHistory();state.user=null;state.view='landing';render()}
function loginTemplate(){const content=LANDING_CONTENT;const demoAcc=(state.data.accounts||[]).find(a=>normalizeAccountRole(a.role)==='상담사')||{loginId:'counselor01',password:'1234'};const loginId=demoAcc.loginId;const password=demoAcc.password;const title='상담사 로그인';const desc='발급받은 상담사 아이디와 비밀번호로 접속합니다.';const demo=`상담사: ${loginId} / ${password}`;return `<div class="login-screen"><section class="login-hero"><div class="real-hero-copy"><span class="real-hero-badge">${content.hero.badge}</span><h1>${content.hero.title}</h1><p>${content.hero.description}</p></div><div class="real-hero-image"><img src="${LANDING_IMAGES.hero}" alt="${content.hero.imageAlt}"></div></section><section class="login-panel"><div class="login-box"><h2>${title}</h2><p>${desc}</p><div class="field"><label>아이디</label><input id="loginId" value="${escapeHtml(loginId)}" autocomplete="username"></div><div class="field"><label>비밀번호</label><input id="loginPw" type="password" value="${escapeHtml(password)}" autocomplete="current-password"></div><button type="button" class="btn full" onclick="login()">접속하기</button><button type="button" class="btn secondary full" onclick="goLanding()" style="margin-top:8px">첫 화면으로 돌아가기</button><div class="demo-info"><strong>시연용 계정</strong><br>${escapeHtml(demo)}</div></div></section></div>`}function login(){const loginId=document.getElementById('loginId').value.trim();const password=document.getElementById('loginPw').value;const acc=(state.data.accounts||[]).find(a=>String(a.loginId||'').trim()===loginId&&String(a.password||'')===password);if(!acc){toast('아이디 또는 비밀번호가 올바르지 않습니다.');return}const expectedRole=APP_ROLE==='admin'?'관리자':'상담사';const actualRole=normalizeAccountRole(acc.role);if(actualRole!==expectedRole){toast(`${expectedRole} 계정으로만 접속할 수 있습니다.`);return}acc.role=actualRole;pushHistory();state.user={accountId:acc.id,loginId:acc.loginId,name:acc.name,role:actualRole};state.view='app';state.active=APP_ROLE==='admin'?'admin':'dashboard';if(!state.selectedParticipantId&&state.data.participants[0])state.selectedParticipantId=state.data.participants[0].id;persist();render()}
function logout(){state.user=null;resetSensitiveSessionData();state.view='landing';persist();render()}
function navButton(id,label){return `<button class="${state.active===id?'active':''}" onclick="setSection('${id}')"><span>${label} (준비중)</span><span>›</span></button>`}function subNavButton(definition){const label=definition.menuLabel||definition.title;return `<button class="${state.active==='modules'&&state.activeModule===definition.id?'active':''}" onclick="setReportModule('${definition.id}')"><span>${definition.available?label:label+' (준비중)'}</span></button>`}function reportSubNavHtml(){return reportMenuDefinitions().map(subNavButton).join('')}function setReportModule(module){if(state.active!=='modules'||state.activeModule!==module)pushHistory();state.active='modules';state.activeModule=module;state.currentReport=null;state.editMode=false;render()}function toggleReportMenu(){state.reportMenuOpen=!state.reportMenuOpen;if(state.reportMenuOpen)state.active='modules';render()}function goDashboard(){if(state.active!=='dashboard')pushHistory();state.active='dashboard';state.activeModule='interest';state.currentReport=null;state.editMode=false;state.reportMenuOpen=false;render()}function activeMainSectionHtml(){if(APP_ROLE==='admin')return adminSection();if(state.active==='modules')return modulesSection();if(state.active==='jobs')return jobMatchingSection();if(state.active==='account')return accountSection();if(state.active==='reports')return reportsSection();return dashboardSection()}function shellTemplate(){const sideBrand=`<div class="side-brand" role="button" tabindex="0" aria-label="메인 대시보드로 이동" onclick="goDashboard()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goDashboard()}"><img src="${BRAND_LOGO}" alt="${BRAND_NAME}" class="sidebar-logo"><div class="title">${BRAND_NAME}</div><div class="sub">${BRAND_SUBTITLE}</div><div class="role-badge">${escapeHtml(state.user.name)} · ${escapeHtml(state.user.role)}</div></div>`;if(APP_ROLE==='admin')return `<div class="shell"><aside class="sidebar no-print">${sideBrand}<nav class="nav"><button class="active" onclick="setSection('admin')"><span>관리자 현황</span><span>›</span></button></nav><div style="margin-top:20px;padding:10px"><button class="btn secondary full" onclick="logout()">로그아웃</button></div></aside><main class="main">${activeMainSectionHtml()}</main></div>`;const reportMenuStyle=state.reportMenuOpen?'':'style="display:none"';return `<div class="shell"><aside class="sidebar no-print">${sideBrand}<nav class="nav"><button class="${state.active==='modules'?'active':''}" onclick="toggleReportMenu()"><span>리포트 생성 (Beta)</span><span>${state.reportMenuOpen?'⌃':'⌄'}</span></button><div class="subnav" ${reportMenuStyle}>${reportSubNavHtml()}</div>${navButton('account','내 계정')}</nav><div style="margin-top:20px;padding:10px"><button class="btn secondary full" onclick="logout()">로그아웃</button></div></aside><main class="main">${activeMainSectionHtml()}</main></div>`}function setSection(id){if(state.active!==id)pushHistory();state.active=id;render()}function activateSection(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));const el=document.getElementById('section-'+id);if(el)el.classList.add('active')}function pageTitle(title,desc,actions=''){const backBtn=state.history&&state.history.length?`<button class="btn secondary" onclick="goBack()">← 뒤로가기</button>`:'';return `<div class="topbar no-print"><div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${backBtn}${actions}</div></div>`}
function workspaceIcon(name){const icons={intake:'<path d="M7 4h10v4H7z"></path><path d="M6 8h12v12H6z"></path><path d="M9 12h6"></path><path d="M9 16h4"></path>',analyze:'<circle cx="11" cy="11" r="5"></circle><path d="M15 15l4 4"></path><path d="M11 8v6"></path><path d="M8 11h6"></path>',draft:'<path d="M5 4h10l4 4v12H5z"></path><path d="M15 4v4h4"></path><path d="M8 13h8"></path><path d="M8 17h6"></path>',deliver:'<path d="M4 5h16v14H4z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path><path d="M16 16l2 2 3-4"></path>',interest:'<path d="M12 3l8 5v8l-8 5-8-5V8z"></path><path d="M12 7v10"></path><path d="M7.5 10l9 4"></path><path d="M16.5 10l-9 4"></path>',success:'<path d="M4 18V6"></path><path d="M4 18h16"></path><path d="M7 15l3-4 3 2 5-7"></path><path d="M16 6h2v2"></path>',job:'<path d="M8 7V5h8v2"></path><path d="M4 8h16v10H4z"></path><path d="M9 12h6"></path><path d="M12 8v10"></path>',interview:'<path d="M5 6h14v9H8l-3 3z"></path><path d="M9 10h6"></path><path d="M9 13h4"></path>'};return `<svg class="workspace-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.draft}</svg>`}
function workflowStep(icon,title,desc){return `<div class="workflow-step"><span class="workflow-icon">${workspaceIcon(icon)}</span><div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(desc)}</span></div></div>`}
function dashboardQuickCard(module,icon,title,desc){return `<button class="quick-card" onclick="setReportModule('${module}')"><span class="quick-icon">${workspaceIcon(icon)}</span><strong>${escapeHtml(title)}</strong><span>${escapeHtml(desc)}</span></button>`}
function dashboardQuickActionsHtml(){return reportQuickDefinitions().map(definition=>{const quick=definition.quickAction;return dashboardQuickCard(definition.id,quick.icon,quick.title,quick.description)}).join('')}function dashboardSection(){const name=state.user?.name||'상담사';return `<section id="section-dashboard" class="section"><div class="ai-workspace"><div class="workspace-hero"><div><div class="workspace-kicker">RE:WORK AI COUNSELING</div><h1>안녕하세요, ${escapeHtml(name)}님.<br><span class="hero-emphasis">오늘도 AI와 함께 상담 리포트를 빠르게 생성해보세요.</span></h1><p>AI가 초안을 만들고, 상담사가 바로 편집 가능한 리포트로 정리합니다.</p></div><div class="workspace-visual"><div class="workspace-logo-card"><img src="${BRAND_LOGO}" alt="${BRAND_NAME}" class="workspace-logo"><div class="workspace-report-lines"><span></span><span></span><span></span></div></div></div></div><div class="workspace-block"><div class="workspace-head"><div><h3>상담 워크플로우</h3><p>내담자 정보 확인부터 리포트 전달까지 한 화면에서 빠르게 이어갑니다.</p></div></div><div class="workflow-grid">${workflowStep('intake','정보 입력','내담자 및 직업 정보와 상담 메모를 입력합니다.')}${workflowStep('analyze','AI 분석','검사 결과와 경력 조건을 통합합니다.')}${workflowStep('draft','초안 편집','AI 리포트 초안을 상담사가 다듬습니다.')}${workflowStep('deliver','상담 진행','더욱 체계적인 상담 진행을 돕습니다.')}</div></div><div class="workspace-block"><div class="workspace-head"><div><h3>빠른 실행</h3><p>자주 사용하는 AI 리포트 생성 화면으로 바로 이동합니다.</p></div></div><div class="quick-grid">${dashboardQuickActionsHtml()}</div></div><div class="workspace-block"><div class="workspace-head"><div><h3>AI 지원 기능</h3><p>생성부터 편집, 출력까지 상담사 업무 흐름에 맞춰 지원합니다.</p></div></div><div class="ai-support-tags"><span class="ai-support-tag">검사 결과 통합 분석</span><span class="ai-support-tag">AI 초안 자동 생성</span><span class="ai-support-tag">상담사 편집 가능</span><span class="ai-support-tag">결과 저장 지원</span></div></div></div></section>`}function recentReportsPanel(){const rows=state.data.reports.slice(0,5).map(r=>`<tr><td>${escapeHtml(r.createdAt)}</td><td>${escapeHtml(r.participantName)}</td><td><span class="pill">${reportTypeName(r.type)}</span></td><td>${escapeHtml(r.title)}</td><td><button class="btn light" onclick="openReport('${r.id}')">열기</button></td></tr>`).join('');return `<div class="panel"><div class="panel-head"><h3>최근 생성 리포트</h3><button class="btn secondary" onclick="setSection('reports')">전체 보기</button></div><div class="panel-body">${rows?`<div class="table-wrap"><table><thead><tr><th>생성일</th><th>참여자</th><th>유형</th><th>제목</th><th>작업</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">아직 생성된 리포트가 없습니다.</div>`}</div></div>`}

t||'';document.getElementById('pCareer').value=p.career||'';document.getElementById('pMemo').value=p.memo||''},0)}function resetParticipantForm(){['participantId','pName','pTarget','pCareer','pMemo'].forEach(id=>document.getElementById(id).value='');document.getElementById('pAge').value='20대';document.getElementById('pStatus').value='구직중';document.getElementById('pDoc').value='기본정보 미입력'}function deleteParticipant(id){if(!confirm('참여자를 삭제할까요? 관련 리포트는 유지됩니다.'))return;state.data.participants=state.data.participants.filter(p=>p.id!==id);if(state.selectedParticipantId===id)state.selectedParticipantId=state.data.participants[0]?.id||null;persist();toast('삭제되었습니다.');render()}function selectParticipant(id){pushHistory();state.selectedParticipantId=id;persist();state.active='modules';render();toast('참여자가 선택되었습니다.')}
function filterParticipants(){const q=(document.getElementById('participantSearch')?.value||'').trim().toLowerCase();document.querySelectorAll('[data-participant-row="true"]').forEach(row=>{row.style.display=(row.dataset.search||'').includes(q)?'':'none'})}function participantSelector(){return ''}function moduleCard(id,title,desc){return `<div class="module-card" style="${state.activeModule===id?'border-color:#1f5f99;background:#fbfdff':''}"><h3>${title}</h3><p>${desc}</p><div class="actions"><button class="btn ${state.activeModule===id?'':'secondary'}" onclick="selectModule('${id}')">${state.activeModule===id?'선택됨':'선택'}</button></div></div>`}function selectModule(id){state.activeModule=id;state.currentReport=null;state.editMode=false;render()}function modulesSection(){const p=getParticipant();return `<section id="section-modules" class="section print-target">${pageTitle(reportTypeName(state.activeModule),sc('modules').desc,participantSelector())}${!p?`<div class="notice">${sc('modules').noParticipant}</div>`:''}<div class="notice no-print"><strong>${reportTypeName(state.activeModule)}</strong><br>${moduleDescription(state.activeModule)}</div><div class="report-layout"><div class="panel form-panel no-print">${state.activeModule==='interest'?moduleForm('interest'):`<div class="panel-head"><h3>${reportTypeName(state.activeModule)}</h3></div><div class="panel-body">${moduleForm(state.activeModule)}</div>`}</div><div class="report-output"><div class="report-toolbar"><div><strong>${sc('modules').previewTitle}</strong><br><span class="small">${sc('modules').previewDesc}</span></div><div class="actions"><button class="btn secondary" onclick="toggleEdit()">${state.editMode?'편집 종료':'편집하기'}</button><button class="btn light" onclick="printReport()">PDF 저장</button></div></div><div id="reportContent" class="report-content" contenteditable="${state.editMode?'true':'false'}">${currentReportHtml()}</div></div></div></section>`}

function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(new Error('파일을 읽을 수 없습니다.'));reader.readAsDataURL(file)})}
function geminiMimeType(file){const name=(file.name||'').toLowerCase();if(file.type)return file.type;if(name.endsWith('.xlsx'))return'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';if(name.endsWith('.xls'))return'application/vnd.ms-excel';if(name.endsWith('.csv'))return'text/csv';if(name.endsWith('.tsv'))return'text/tab-separated-values';if(name.endsWith('.docx'))return'application/vnd.openxmlformats-officedocument.wordprocessingml.document';if(name.endsWith('.txt'))return'text/plain';if(name.endsWith('.png'))return'image/png';if(name.endsWith('.jpg')||name.endsWith('.jpeg'))return'image/jpeg';if(name.endsWith('.webp'))return'image/webp';return'application/octet-stream'}
function currentReportHtml(){return state.currentReport?.html||emptyReport()}function geminiPromptText(p,target,memo,files,promptItems){const hasTarget=!!String(target||'').trim()&&String(target).trim()!=='검사 결과 기반 추천 직무';const builder=hasTarget?window.GEMINI_TARGET_JOB_ANALYSIS_PROMPT:window.GEMINI_NO_TARGET_JOB_ANALYSIS_PROMPT;if(!builder?.user)throw new Error('직무분석 프롬프트 파일을 찾지 못했습니다.');return builder.user({p,target,memo,files,promptItems,mimeType:geminiMimeType})}
function cleanGeminiHtml(text){let out=String(text||'').trim().replace(/^```html\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();if(/<h1|<h2|<table|<ul/i.test(out))return out;const escaped=escapeHtml(out);return escaped.split(/\n{2,}/).map(block=>{const b=block.trim();if(!b)return'';if(/^#{1,3}\s+/.test(b)){const level=Math.min((b.match(/^#+/)||[''])[0].length,3);return`<h${level}>${b.replace(/^#{1,3}\s+/,'')}</h${level}>`}if(/^- /.test(b)){return`<ul>${b.split('\n').filter(Boolean).map(line=>`<li>${line.replace(/^- /,'')}</li>`).join('')}</ul>`}return`<p>${b.replace(/\n/g,'<br>')}</p>`}).join('')}
function parseGeminiJson(text){let raw=String(text||'').trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();try{return JSON.parse(raw)}catch(err){const match=raw.match(/\{[\s\S]*\}/);if(match)return JSON.parse(match[0]);throw err}}

async function generateGeminiJobAnalysis(p,target){const apiKey=val('geminiApiKey');const model=val('geminiModel')||getGeminiModel('jobAnalysis');const files=Array.from(document.getElementById('jobAnalysisFiles')?.files||[]);const memo=val('jobAnalysisMemo');if(!apiKey)throw new Error('Gemini API 키를 입력해주세요.');if(!files.length)throw new Error('검사 결과 자료를 추가해주세요.');localStorage.setItem('GEMINI_API_KEY',apiKey);const btn=document.getElementById('jobAnalysisButton');const oldText=btn?btn.textContent:'';if(btn){btn.disabled=true;btn.textContent='리포트 작성 중...'}try{const parts=[{text:geminiPromptText(p,target,memo,files)}];for(const file of files){if(file.size>20*1024*1024)throw new Error(`${file.name} 파일은 20MB 이하만 사용할 수 있습니다.`);parts.push({text:`검사 결과 파일: ${file.name}`});parts.push({inline_data:{mime_type:geminiMimeType(file),data:await fileToBase64(file)}})}const res=await window.AI_GATEWAY.generateContent({apiKey,model,body:{contents:[{role:'user',parts}],generationConfig:{temperature:.25,topP:.9}}});const data=await res.json().catch(()=>({}));if(!res.ok){const msg=data?.error?.message||`Gemini API 오류 (${res.status})`;throw new Error(msg)}const text=(data?.candidates?.[0]?.content?.parts||[]).map(part=>part.text||'').join('\n').trim();if(!text)throw new Error('Gemini 응답에서 리포트 내용을 찾지 못했습니다.');return{title:`${p.name} 직무분석리포트`,html:cleanGeminiHtml(text)}}finally{if(btn){btn.disabled=false;btn.textContent=oldText||'직무분석리포트 생성'}}}
function baseIntro(p){return `<div class="summary-box"><p><strong>참여자:</strong> ${escapeHtml(p.name)} / ${escapeHtml(p.age)} / ${escapeHtml(p.status)}</p><p><strong>희망 방향:</strong> ${escapeHtml(p.target||'미입력')}</p><p><strong>주요 경력:</strong> ${escapeHtml(p.career||'미입력')}</p><p><strong>상담사 메모:</strong> ${escapeHtml(p.memo||'미입력')}</p></div>`}
function interestLevel(score){if(score<=40)return'낮음(-)';if(score<=59)return'중간(=)';return'높음(+)'}
function interestCode(scores){const labels={R:'현실형',I:'탐구형',A:'예술형',S:'사회형',E:'진취형',C:'관습형'};return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>k).join('')+' ('+Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>labels[k]).join('/')+')'}
function hexChart(scores){const labels={R:['현실형(R)','실행/사물'],I:['탐구형(I)','사고/아이디어'],A:['예술형(A)','창조/표현'],S:['사회형(S)','자선/사람'],E:['진취형(E)','관리/과제'],C:['관습형(C)','동조/자료']};const order=['R','I','A','S','E','C'];const cx=250,cy=240,maxR=150;function pt(i,r){const angle=(-90+i*60)*Math.PI/180;return [cx+Math.cos(angle)*r,cy+Math.sin(angle)*r]}const grids=[20,40,60,80,100].map(v=>`<polygon class="hex-grid" points="${order.map((_,i)=>pt(i,maxR*v/100).join(',')).join(' ')}"></polygon>`).join('');const axes=order.map((_,i)=>{const p=pt(i,maxR);return `<line class="hex-axis" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"></line>`}).join('');const area=order.map((k,i)=>pt(i,maxR*Math.max(0,Math.min(100,scores[k]))/100).join(',')).join(' ');const points=order.map((k,i)=>{const p=pt(i,maxR*Math.max(0,Math.min(100,scores[k]))/100);return `<circle class="hex-point" cx="${p[0]}" cy="${p[1]}" r="4"></circle>`}).join('');const labelSvg=order.map((k,i)=>{const p=pt(i,maxR+42);const align=i===0||i===3?'middle':(i<3?'start':'end');return `<text class="hex-label" x="${p[0]}" y="${p[1]}" text-anchor="${align}">${labels[k][0]}</text><text class="hex-score" x="${p[0]}" y="${p[1]+16}" text-anchor="${align}">${labels[k][1]} · ${scores[k]}점</text>`}).join('');return `<div class="hex-wrap"><svg class="hex-chart" viewBox="0 0 500 470" role="img" aria-label="직업선호도검사 흥미의 육각형 차트"><text x="250" y="24" text-anchor="middle" style="font-size:17px;font-weight:900;fill:#0f2742">흥미의 육각형 모형</text>${grids}${axes}<polygon class="hex-area" points="${area}"></polygon>${points}${labelSvg}<text x="250" y="452" text-anchor="middle" style="font-size:12px;fill:#667085">표준점수 기준: 40 이하 낮음 · 41~59 중간 · 60 이상 높음</text></svg></div>`}
function interestReport(p,scores,job1,job2){const labels={R:'현실형',I:'탐구형',A:'예술형',S:'사회형',E:'진취형',C:'관습형'};const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const top=sorted.slice(0,2).map(([k,v])=>`${labels[k]}(${k}) ${v}점`).join(', ');const low=sorted.slice(-2).map(([k,v])=>`${labels[k]}(${k}) ${v}점`).join(', ');const rows=Object.entries(scores).map(([k,v])=>`<tr><td>${labels[k]}(${k})</td><td>${v}</td><td>${interestLevel(v)}</td></tr>`).join('');return `<h1>${escapeHtml(p.name)} 직업선호도검사 리포트</h1>${baseIntro(p)}<h2>1. 직업선호도검사 결과 요약</h2><div class="summary-box"><p><strong>흥미코드:</strong> ${interestCode(scores)}</p><p><strong>상위 유형:</strong> ${top}</p><p><strong>낮은 유형:</strong> ${low}</p></div><h2>2. 흥미의 육각형 모형</h2>${hexChart(scores)}<p>육각형이 한쪽으로 뚜렷하게 치우치면 특정 분야에 대한 관심이 비교적 분명한 편이고, 정육각형에 가까우면 여러 분야에 고르게 관심을 보일 수 있습니다. 육각형의 전체 크기가 작으면 직업 탐색 경험을 더 넓히는 상담이 필요합니다.</p><h2>3. 입력 점수표</h2><div class="table-wrap"><table><thead><tr><th>지표</th><th>표준점수</th><th>해석</th></tr></thead><tbody>${rows}</tbody></table></div><h2>4. 종합 해석</h2><p>직업선호도검사는 좋아하는 활동, 관심 있는 직업, 선호 분야를 탐색하여 흥미유형에 적합한 직업을 참고하도록 돕는 검사입니다. 다만 현재 보유 능력, 자격, 학력, 가치관을 모두 반영하는 것은 아니므로 상담에서는 경력·자격·근무조건을 함께 고려해야 합니다.</p><h2>5. 관심 직업 2개와 결과의 연결</h2><ul><li><strong>${escapeHtml(job1)}:</strong> 상위 선호 유형과 연결되는 업무활동을 중심으로 적합성을 검토합니다.</li><li><strong>${escapeHtml(job2)}:</strong> 직업명만 보고 판단하지 말고, 실제 업무가 사람 중심인지, 데이터 중심인지, 실행 중심인지 분석해야 합니다.</li></ul><h2>6. 상담 포인트</h2><ul><li>검사결과를 직업명으로 바로 연결하지 말고 업무활동 단위로 해석합니다.</li><li>관심 직업 2개를 실제 채용공고와 비교해 현실성을 점검합니다.</li><li>흥미, 경력, 자격, 근무조건이 만나는 지점을 찾아 자기소개서 소재로 전환합니다.</li></ul><h2>7. 참여자 전달용 요약</h2><p>이번 결과는 앞으로 어떤 직업을 선택해야 하는지를 단정하기보다, 어떤 방식으로 일할 때 더 몰입할 수 있는지를 보여줍니다. 관심 직업인 ${escapeHtml(job1)}, ${escapeHtml(job2)}를 실제 업무내용과 비교하면서 본인에게 맞는 세부 직무를 좁혀가는 것이 좋습니다.</p>`}

function jobMatchingSection(){const p=getParticipant();const results=state.jobResults||[];const savedRows=(state.data.jobMatches||[]).slice(0,5).map(m=>`<tr><td>${escapeHtml(m.createdAt)}</td><td>${escapeHtml(m.participantName)}</td><td>${escapeHtml(m.query.job)}</td><td>${m.results.length}</td><td><button class="btn light" onclick="loadJobMatch('${m.id}')">불러오기</button></td></tr>`).join('');return `<section id="section-jobs" class="section">${pageTitle(sc('jobs').title,sc('jobs').desc,participantSelector())}${!p?`<div class="notice">${sc('modules').noParticipant}</div>`:''}<div class="job-match-layout"><div class="panel form-panel"><div class="panel-head"><h3>${sc('jobs').formTitle}</h3></div><div class="panel-body"><div class="job-api-box"><strong>${sc('jobs').apiTitle}</strong><br>${sc('jobs').apiDesc}</div>${p?`<div class="notice">선택 참여자: <strong>${escapeHtml(p.name)}</strong> / ${escapeHtml(p.age)} / ${escapeHtml(p.status)}<br>기존 희망 방향: ${escapeHtml(p.target||'미입력')}</div>`:''}<div class="field"><label>희망 직무 *</label><input id="jobKeyword" value="${escapeHtml(p?.target||'')}" placeholder="예: 영업관리, 직업상담사, 인사총무"></div><div class="grid-2"><div class="field"><label>희망 지역</label><input id="jobRegion" placeholder="예: 서울, 경기, 부산"></div><div class="field"><label>경력</label><select id="jobCareer"><option value="">선택 안 함</option><option>신입</option><option>1~3년</option><option>3~5년</option><option>5년 이상</option><option>경력무관</option></select></div></div><div class="grid-2"><div class="field"><label>고용형태</label><select id="jobType"><option value="">선택 안 함</option><option>정규직</option><option>계약직</option><option>시간제</option><option>파견/도급</option><option>프리랜서</option></select></div><div class="field"><label>희망 연봉</label><input id="jobSalary" placeholder="예: 3000만원 이상, 회사내규"></div></div><div class="grid-2"><div class="field"><label>근무시간</label><input id="jobWorktime" placeholder="예: 주5일, 09:00~18:00, 유연근무"></div><div class="field"><label>자격증</label><input id="jobCert" placeholder="예: 직업상담사, 컴활, 지게차"></div></div><div class="field"><label>우대조건</label><textarea id="jobPreference" placeholder="예: 중장년 우대, 상담 경험, 엑셀 가능, 운전 가능"></textarea></div><div class="actions"><button class="btn full" onclick="searchJobMatches()">현재 채용공고 매칭</button><button class="btn secondary full" onclick="resetJobForm()">조건 초기화</button></div></div></div><div><div class="panel"><div class="panel-head"><h3>${sc('jobs').resultTitle}</h3><div class="actions"><button class="btn light" onclick="saveJobMatchResults()">매칭 결과 저장</button><button class="btn light" onclick="saveJobMatchAsReport()">리포트 섹션으로 저장</button></div></div><div class="panel-body"><div class="api-source-row"><div class="match-box"><strong>워크넷/고용24 수집 기준</strong>키워드, 직종, 희망지역, 경력조건, 고용형태를 기준으로 현재 진행중 공고를 조회하도록 설계</div><div class="match-box"><strong>사람인 수집 기준</strong>기업명, 공고명, 직무 키워드, 지역, 직무코드, 고용형태 조건으로 현재 진행중 공고를 조회하도록 설계</div></div><div id="jobResultArea" style="margin-top:14px">${results.length?jobResultCards(results):`<div class="empty">희망 직무를 입력하고 매칭을 실행하세요.<br>결과는 적합도 높은 순으로 정리됩니다.</div>`}</div></div></div><div class="panel"><div class="panel-head"><h3>${sc('jobs').recentTitle}</h3></div><div class="panel-body">${savedRows?`<div class="table-wrap"><table><thead><tr><th>저장일</th><th>참여자</th><th>희망 직무</th><th>공고 수</th><th>작업</th></tr></thead><tbody>${savedRows}</tbody></table></div>`:`<div class="empty">저장된 채용정보 매칭 결과가 없습니다.</div>`}</div></div></div></div></section>`}
function resetJobForm(){['jobKeyword','jobRegion','jobSalary','jobWorktime','jobCert','jobPreference'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});['jobCareer','jobType'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''});state.jobResults=[];render()}
function getJobQuery(){return{job:val('jobKeyword'),region:val('jobRegion'),career:val('jobCareer'),type:val('jobType'),salary:val('jobSalary'),worktime:val('jobWorktime'),cert:val('jobCert'),preference:val('jobPreference')}}
function searchJobMatches(){if(!DEVELOPMENT_MODE){toast('채용정보 매칭은 서버 API 연동 후 사용할 수 있습니다.');return}const p=getParticipant();if(!p){toast('참여자를 먼저 선택해주세요.');return}const q=getJobQuery();if(!q.job){toast('희망 직무는 필수 입력사항입니다.');return}const jobs=buildJobCandidates(q,p).map(j=>scoreJob(j,q,p)).sort((a,b)=>b.score-a.score);state.jobResults=jobs;state.lastJobQuery=q;toast('개발 모드 샘플 공고 기준 매칭 결과를 정리했습니다.');render()}
function buildJobCandidates(q,p){const baseJob=q.job||'직무';const region=q.region||'서울';const type=q.type||'정규직';const career=q.career||'경력무관';const cert=q.cert||'';const pref=q.preference||'';const salary=q.salary||'회사내규';const worktime=q.worktime||'주5일';return[{source:'워크넷/고용24',company:'서울고용서비스센터 협력기관',title:`${baseJob} 상담·행정 지원 담당`,region:region||'서울',career:career,employment:type,salary:salary,worktime:worktime,deadline:'채용시까지',keywords:[baseJob,'상담','행정','고용서비스','문서작성'],requirements:['내담자 응대 및 상담 기록 관리','구직자 취업지원 행정 처리','상담 자료 정리 및 보고서 작성'],preferred:[cert||'직업상담사 자격 우대',pref||'고용서비스 경험 우대','문서작성 가능자']},{source:'사람인',company:'커리어컨설팅 전문기업',title:`${baseJob} 경력 전환 컨설턴트`,region:region||'서울/경기',career:career==='신입'?'1~3년':career,employment:type||'계약직',salary:salary||'면접 후 결정',worktime:worktime||'주5일 09:00~18:00',deadline:'D-14',keywords:[baseJob,'경력상담','전직지원','보고서','커뮤니케이션'],requirements:['참여자 경력진단 및 취업전략 수립','기업·직무 정보 조사','상담 리포트 작성 및 사후관리'],preferred:[cert||'직업상담사·HR 관련 자격 우대',pref||'중장년 상담 경험','프레젠테이션 가능자']},{source:'워크넷/고용24',company:'중장년일자리 지원기관',title:`신중년 ${baseJob} 매칭 전담자`,region:region||'전국',career:career||'경력무관',employment:type||'시간제',salary:salary||'월 230만원 이상',worktime:worktime||'주5일 또는 시간제 협의',deadline:'D-21',keywords:[baseJob,'신중년','일자리매칭','상담','사업운영'],requirements:['신중년 참여자 초기상담','직무별 채용정보 탐색 및 매칭','프로그램 운영 자료 관리'],preferred:[cert||'상담·사회복지·평생교육 관련 자격',pref||'중장년 우대 이해도','공공사업 경험']},{source:'사람인',company:'B2B 교육·HRD 기업',title:`${baseJob} 교육운영 및 기업고객 관리`,region:region||'서울',career:career||'3~5년',employment:type||'정규직',salary:salary||'3,200만원 이상',worktime:worktime||'주5일',deadline:'D-30',keywords:[baseJob,'교육운영','B2B','고객관리','성과관리'],requirements:['기업교육 운영 일정 관리','고객사 커뮤니케이션','교육 만족도 및 결과보고서 작성'],preferred:[cert||'HRD·상담 관련 자격 우대',pref||'B2B 고객응대 경험','엑셀·문서작성 능숙자']},{source:'워크넷/고용24',company:'지역 일자리센터',title:`${baseJob} 취업지원 담당자`,region:region||'지역 선택 가능',career:career||'경력무관',employment:type||'계약직',salary:salary||'기관 내규',worktime:worktime||'주5일',deadline:'채용시까지',keywords:[baseJob,'취업지원','채용정보','구직상담','사후관리'],requirements:['구직자 희망조건 파악','채용공고 탐색 및 알선','입사지원 서류 점검과 사후관리'],preferred:[cert||'직업상담사 우대',pref||'공공기관 사업 이해','운전 가능자 우대']}];}
function scoreJob(job,q,p){let score=55;const hay=(job.title+' '+job.company+' '+job.region+' '+job.career+' '+job.employment+' '+job.salary+' '+job.worktime+' '+job.keywords.join(' ')+' '+job.requirements.join(' ')+' '+job.preferred.join(' ')).toLowerCase();const terms=[q.job,q.region,q.career,q.type,q.cert,q.preference].filter(Boolean).flatMap(x=>String(x).split(/[\s,\/]+/)).filter(x=>x.length>=2);terms.forEach(t=>{if(hay.includes(t.toLowerCase()))score+=7});if((p.career||'').split(/[\s,\/]+/).some(t=>t.length>=2&&hay.includes(t.toLowerCase())))score+=6;if(score>96)score=96;const possibility=score>=85?'상':'중';const gaps=[];if(!q.cert)gaps.push('직무 관련 자격증 또는 교육 이수 여부 확인');if(!q.region)gaps.push('통근 가능 지역 구체화');if(!q.salary)gaps.push('희망 연봉 하한선 정리');if(!q.preference)gaps.push('우대조건과 본인 경험 연결 문장 준비');return{...job,score,possibility,gaps:gaps.slice(0,3),comment:`${escapeHtml(p.name)}님의 기존 경력과 ${escapeHtml(q.job)} 희망 방향을 기준으로 볼 때, 이 공고는 ${score>=85?'우선 검토할 만한 공고입니다':'조건 보완 후 검토할 공고입니다'}. 상담에서는 직무 요구사항 중 본인 경험으로 바로 증명 가능한 항목을 먼저 표시하고, 부족한 요건은 교육·자격·근무조건 조정으로 보완하는 방향이 적합합니다.`}}
function jobResultCards(results){return `<div class="job-results">${results.map((j,i)=>`<div class="job-card"><div class="job-card-head"><div><h4>${i+1}. ${escapeHtml(j.title)}</h4><div class="small">${escapeHtml(j.company)} · 출처: ${escapeHtml(j.source)} · 마감: ${escapeHtml(j.deadline)}</div></div><div class="match-score">${j.score}점<br><span class="small">적합도</span></div></div><div class="job-meta"><span>${escapeHtml(j.region)}</span><span>${escapeHtml(j.career)}</span><span>${escapeHtml(j.employment)}</span><span>${escapeHtml(j.salary)}</span><span>${escapeHtml(j.worktime)}</span></div><div class="match-grid"><div class="match-box"><strong>지원 가능성</strong>${escapeHtml(j.possibility)} · ${j.score>=85?'조건 부합도가 높아 우선 추천':'일부 조건 확인 필요'}</div><div class="match-box"><strong>필요 보완 역량</strong>${j.gaps.map(g=>`- ${escapeHtml(g)}`).join('<br>')}</div><div class="match-box"><strong>상담사 추천 코멘트</strong>${escapeHtml(j.comment)}</div></div><h3>주요 업무</h3><ul>${j.requirements.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul><h3>우대조건</h3><ul>${j.preferred.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>`).join('')}</div>`}
function saveJobMatchResults(){const p=getParticipant();const results=state.jobResults||[];if(!p||!results.length){toast('저장할 매칭 결과가 없습니다.');return}const item={id:uid(),participantId:p.id,participantName:p.name,query:state.lastJobQuery||{job:val('jobKeyword')},results,createdAt:today()};state.data.jobMatches.unshift(item);persist();toast('채용정보 매칭 결과가 저장되었습니다.');render()}
function loadJobMatch(id){const m=(state.data.jobMatches||[]).find(x=>x.id===id);if(!m)return;pushHistory();state.selectedParticipantId=m.participantId;state.jobResults=m.results;state.lastJobQuery=m.query;state.active='jobs';persist();render();toast('저장된 매칭 결과를 불러왔습니다.')}
function jobMatchReportHtml(p,query,results){return `<h1>${escapeHtml(p.name)} 채용정보 매칭 리포트</h1>${baseIntro(p)}<h2>1. 내담자 희망 조건</h2><div class="summary-box"><p><strong>희망 직무:</strong> ${escapeHtml(query.job||'')}</p><p><strong>희망 지역:</strong> ${escapeHtml(query.region||'선택 안 함')}</p><p><strong>경력:</strong> ${escapeHtml(query.career||'선택 안 함')}</p><p><strong>고용형태:</strong> ${escapeHtml(query.type||'선택 안 함')}</p><p><strong>연봉:</strong> ${escapeHtml(query.salary||'선택 안 함')}</p><p><strong>근무시간:</strong> ${escapeHtml(query.worktime||'선택 안 함')}</p><p><strong>자격증:</strong> ${escapeHtml(query.cert||'선택 안 함')}</p><p><strong>우대조건:</strong> ${escapeHtml(query.preference||'선택 안 함')}</p></div><h2>2. 이 내담자에게 지금 지원 가능한 채용정보</h2>${jobResultCards(results)}<h2>3. 리포트 연결 방식</h2><ul><li><strong>기업 분석 리포트:</strong> 추천 공고의 기업명을 선택해 기업·직무 분석으로 확장합니다.</li><li><strong>신중년 경력자산 리포트:</strong> 공고 요구역량과 참여자 경력자산의 격차를 보완계획으로 연결합니다.</li><li><strong>성공사례 리포트:</strong> 유사 전직 성공사례와 비교해 참여자가 이해하기 쉬운 실행 경로를 제시합니다.</li></ul><h2>4. 상담사 활용 메모</h2><p>공고를 단순히 전달하지 말고, 적합도 높은 순서로 우선 지원 후보를 정한 뒤 부족한 자격·경험·근무조건을 상담에서 조정합니다. 실서비스에서는 워크넷/고용24 및 사람인 API의 현재 진행중 공고만 조회하도록 서버에서 주기적으로 갱신합니다.</p>`}
function saveJobMatchAsReport(){const p=getParticipant();const results=state.jobResults||[];const query=state.lastJobQuery||getJobQuery();if(!p||!results.length){toast('리포트로 저장할 매칭 결과가 없습니다.');return}const report={id:uid(),type:'jobs',title:`${p.name} 채용정보 매칭 리포트`,participantId:p.id,participantName:p.name,html:withReportBrand(jobMatchReportHtml(p,query,results),`${p.name} 채용정보 매칭 리포트`),createdAt:today()};state.data.reports.unshift(report);persist();toast('채용정보 매칭 리포트가 보관함에 저장되었습니다.');pushHistory();state.currentReport={...report};state.active='modules';state.activeModule='company';render()}

function syncCurrentReportHtml(){const el=document.getElementById('reportContent');if(state.currentReport&&el)state.currentReport.html=el.innerHTML}
function toggleEdit(){if(!state.currentReport){toast('편집할 리포트가 없습니다.');return}syncCurrentReportHtml();state.editMode=!state.editMode;render();setTimeout(()=>{const el=document.getElementById('reportContent');if(el&&state.editMode)el.focus()},0)}
function printReport(){if(!state.currentReport){toast('출력할 리포트가 없습니다.');return}syncCurrentReportHtml();window.print()}
function reportsSection(){const rows=state.data.reports.map(r=>`<tr><td>${escapeHtml(r.createdAt)}</td><td>${escapeHtml(r.participantName)}</td><td><span class="pill">${reportTypeName(r.type)}</span></td><td>${escapeHtml(r.title)}</td><td class="actions"><button class="btn light" onclick="openReport('${r.id}')">열기</button><button class="btn secondary" onclick="duplicateReport('${r.id}')">복제</button><button class="btn danger" onclick="deleteReport('${r.id}')">삭제</button></td></tr>`).join('');return `<section id="section-reports" class="section">${pageTitle(sc('reports').title,sc('reports').desc)}<div class="panel"><div class="panel-head"><h3>${sc('reports').panelTitle}</h3></div><div class="panel-body">${rows?`<div class="table-wrap"><table><thead><tr><th>생성일</th><th>참여자</th><th>유형</th><th>제목</th><th>작업</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">${sc('reports').empty}</div>`}</div></div></section>`}function duplicateReport(id){const r=state.data.reports.find(x=>x.id===id);if(!r)return;const copy={...r,id:uid(),title:r.title+' 복사본',createdAt:today()};state.data.reports.unshift(copy);persist();toast('리포트가 복제되었습니다.');render()}function deleteReport(id){if(!confirm('리포트를 삭제할까요?'))return;state.data.reports=state.data.reports.filter(r=>r.id!==id);if(state.currentReport?.id===id)state.currentReport=null;persist();toast('삭제되었습니다.');render()}function adminSection(){return ''}
function saveAccount(){if(!state.user||state.user.role!=='관리자'){toast('관리자만 계정을 저장할 수 있습니다.');return}const id=document.getElementById('accountId').value;const name=val('accName');const loginId=val('accLoginId');const password=val('accPw');if(!name||!loginId||!password){toast('이름, 아이디, 비밀번호를 모두 입력해주세요.');return}const duplicate=(state.data.accounts||[]).find(a=>a.loginId===loginId&&a.id!==id);if(duplicate){toast('이미 사용 중인 아이디입니다.');return}const existing=id?state.data.accounts.find(a=>a.id===id):null;const item={...(existing||{}),id:id||uid(),name,loginId,password,role:'상담사',isDemo:existing?.isDemo===true,source:existing?.source||'admin',createdAt:existing?.createdAt||today()};if(id){const idx=state.data.accounts.findIndex(a=>a.id===id);if(idx>=0)state.data.accounts[idx]=item}else{state.data.accounts.push(item)}persist();toast('상담사 계정이 저장되었습니다.');render()}
function fillAccountForm(id){const a=(state.data.accounts||[]).find(x=>x.id===id);if(!a||a.role!=='상담사'){toast('상담사 계정만 수정할 수 있습니다.');return}setTimeout(()=>{document.getElementById('accountId').value=a.id;document.getElementById('accName').value=a.name;document.getElementById('accLoginId').value=a.loginId;document.getElementById('accPw').value=a.password},0)}
function resetAccountForm(){['accountId','accName','accLoginId','accPw'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=''})}
function deleteAccount(id){const a=(state.data.accounts||[]).find(x=>x.id===id);if(!a||a.role!=='상담사')return;if(!confirm('상담사 계정을 삭제할까요?'))return;state.data.accounts=state.data.accounts.filter(x=>x.id!==id);persist();toast('계정이 삭제되었습니다.');render()}
function accountSection(){if(!state.user||state.user.role==='관리자')return `<section id="section-account" class="section"></section>`;return `<section id="section-account" class="section">${pageTitle(sc('account').title,sc('account').desc)}<div class="panel"><div class="panel-head"><h3>${sc('account').passwordTitle}</h3></div><div class="panel-body"><div class="account-card"><strong>${escapeHtml(state.user.name)}</strong><br><span class="small">아이디: ${escapeHtml(state.user.loginId)} · 권한: ${escapeHtml(state.user.role)}</span></div><div class="field"><label>현재 비밀번호</label><input id="currentPw" type="password"></div><div class="field"><label>새 비밀번호</label><input id="newPw" type="password"></div><div class="field"><label>새 비밀번호 확인</label><input id="newPw2" type="password"></div><button class="btn" onclick="changeMyPassword()">비밀번호 변경</button></div></div></section>`}
function changeMyPassword(){const acc=(state.data.accounts||[]).find(a=>a.id===state.user.accountId);if(!acc){toast('계정 정보를 찾을 수 없습니다.');return}const cur=val('currentPw'),next=val('newPw'),next2=val('newPw2');if(acc.password!==cur){toast('현재 비밀번호가 일치하지 않습니다.');return}if(!next||next.length<4){toast('새 비밀번호는 4자 이상으로 입력해주세요.');return}if(next!==next2){toast('새 비밀번호 확인이 일치하지 않습니다.');return}acc.password=next;persist();toast('비밀번호가 변경되었습니다. 다음 로그인부터 새 비밀번호를 사용하세요.');render()}
function geminiInterestModelCandidates(){const primary=getGeminiModel('interest');return Array.from(new Set([primary,'gemini-2.0-flash','gemini-2.5-flash'].filter(Boolean)))}
const GEMINI_TEMPORARY_ERROR_MESSAGE='AI 서버가 일시적으로 혼잡합니다.\n잠시 후 다시 시도해 주세요.';
const GEMINI_RATE_LIMIT_ERROR_MESSAGE='현재 AI 사용량이 많아 잠시 후 다시 시도해 주세요.';
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function isGeminiRetryableError(err){const msg=String(err?.message||err||'').toLowerCase();return err?.status===503||err?.isNetworkError||err instanceof TypeError||msg.includes('failed to fetch')||msg.includes('network')}
// TODO(security): 상용 배포 시 아래 Gemini 직접 호출을 서버 프록시 API로 이동하고 브라우저에서 API 키를 제거해야 합니다.
async function fetchGeminiWithRetry(url,options){const delays=[2000,5000,10000];let lastErr=null;for(let attempt=0;attempt<=delays.length;attempt++){try{const res=await fetch(url,options);if(res.status===429){const apiError=await res.clone().json().catch(()=>({status:res.status,statusText:res.statusText}));console.error('Gemini API 사용량 제한 오류:',apiError);const friendly=new Error(GEMINI_RATE_LIMIT_ERROR_MESSAGE);friendly.status=429;friendly.isGeminiRateLimit=true;friendly.apiError=apiError;friendly.apiMessage=apiError?.error?.message||GEMINI_RATE_LIMIT_ERROR_MESSAGE;throw friendly}if(res.status===503){const apiError=await res.clone().json().catch(()=>({status:res.status,statusText:res.statusText}));const err=new Error(apiError?.error?.message||`Gemini API 오류 (${res.status})`);err.status=res.status;err.apiError=apiError;err.apiMessage=apiError?.error?.message||err.message;throw err}return res}catch(err){lastErr=err;if(err instanceof TypeError)err.isNetworkError=true;console.error('Gemini API 호출 오류:',err);if(err?.isGeminiRateLimit)throw err;if(!isGeminiRetryableError(err)||attempt===delays.length){if(isGeminiRetryableError(err)){const friendly=new Error(GEMINI_TEMPORARY_ERROR_MESSAGE);friendly.status=lastErr?.status||503;friendly.apiMessage=lastErr?.apiMessage||lastErr?.message||GEMINI_TEMPORARY_ERROR_MESSAGE;friendly.cause=lastErr;friendly.isGeminiTemporaryFailure=true;throw friendly}throw err}await wait(delays[attempt])}}}
async function fetchGeminiInterestWithModelFallback(apiKey,body){const models=geminiInterestModelCandidates();let lastErr=null;for(let index=0;index<models.length;index++){const model=models[index];try{const res=await window.AI_GATEWAY.generateContent({apiKey,model,body,request:fetchGeminiWithRetry});if(!res.ok&&(res.status===400||res.status===404)&&index<models.length-1){const apiError=await res.clone().json().catch(()=>({status:res.status,statusText:res.statusText}));lastErr=new Error(apiError?.error?.message||`Gemini 모델 ${model}을 사용할 수 없습니다.`);lastErr.status=res.status;console.warn(`Gemini 모델 ${model} 사용 불가, 다음 후보 모델로 재시도합니다.`,apiError);continue}return res}catch(err){lastErr=err;if(!err?.isGeminiTemporaryFailure||index===models.length-1)throw err;console.warn(`Gemini 모델 ${model} 일시 장애, 다음 후보 모델로 재시도합니다.`,err)}}throw lastErr||new Error(GEMINI_TEMPORARY_ERROR_MESSAGE)}
function isGeminiTemporaryBusy(err){const msg=String(err?.message||err||'').toLowerCase();return msg.includes('high demand')||msg.includes('overloaded')||msg.includes('try again later')||msg.includes('resource_exhausted')||msg.includes('unavailable')||msg.includes('503')}
const fetchGeminiWithRetryWithoutUsage=fetchGeminiWithRetry;
fetchGeminiWithRetry=async function(url,options){const startedAt=Date.now();try{const response=await fetchGeminiWithRetryWithoutUsage(url,options);if(response.ok)recordUsageEvent('ai_request_succeeded',{durationMs:Date.now()-startedAt,status:response.status});else recordUsageEvent('ai_request_failed',{durationMs:Date.now()-startedAt,status:response.status});return response}catch(err){recordUsageEvent('ai_request_failed',{durationMs:Date.now()-startedAt,status:err?.status||0,errorName:err?.name||'Error'});throw err}}
const generateSuccessReportWithoutUsage=generateSuccessReportWithGemini;
generateSuccessReportWithGemini=async function(){const startedAt=Date.now();const beforeReport=state.currentReport;recordUsageEvent('report_generation_started',{reportType:'success'});try{const result=await generateSuccessReportWithoutUsage();const succeeded=state.currentReport&&state.currentReport!==beforeReport;recordUsageEvent(succeeded?'report_generation_succeeded':'report_generation_failed',{reportType:'success',durationMs:Date.now()-startedAt,...(succeeded?{}:{reason:'not_generated'})});return result}catch(err){recordUsageEvent('report_generation_failed',{reportType:'success',durationMs:Date.now()-startedAt,errorName:err?.name||'Error'});throw err}}
const generateReportWithoutUsage=generateReport;
generateReport=async function(type,priority){const reportModule=window.REPORT_MODULES?.get(type);if(reportModule?.tracksGenerationUsage)return generateReportWithoutUsage(type,priority);const startedAt=Date.now();const beforeReport=state.currentReport;recordUsageEvent('report_generation_started',{reportType:type});try{const result=await generateReportWithoutUsage(type,priority);const succeeded=state.currentReport&&state.currentReport!==beforeReport;if(succeeded)recordUsageEvent('report_generation_succeeded',{reportType:type,durationMs:Date.now()-startedAt});else recordUsageEvent('report_generation_failed',{reportType:type,durationMs:Date.now()-startedAt,reason:'not_generated'});return result}catch(err){recordUsageEvent('report_generation_failed',{reportType:type,durationMs:Date.now()-startedAt,errorName:err?.name||'Error'});throw err}}
load();render();
</script>
