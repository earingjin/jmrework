<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RE:WORK</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div><div id="toast" class="toast"></div>
<script src="successData.js"></script>
<script src="contentData.js"></script>
<script src="landingData.js"></script>
<script src="mockData.js"></script>
<script src="geminiPromptTemplate.js"></script>
<script>
const STORAGE_KEY='ai_career_report_index_v2';
const USE_MOCK_DATA = false;
const USE_MOCK_AI = false;
const BRAND_NAME = 'RE:WORK CENTER';
const BRAND_SUBTITLE = 'AI Career Solution';
const APP_ROLE='counselor';
const BRAND_LOGO = 'assets/brand-logo.png';
const DEFAULT_GEMINI_MODEL='gemini-2.5-flash';
window.AICareerReportConfig=window.AICareerReportConfig||{};
const GEMINI_API_KEY = window.AICareerReportConfig.geminiApiKey || '';
function getGeminiModel(scope='default'){const cfg=window.AICareerReportConfig||{};return cfg[`${scope}GeminiModel`]||cfg.geminiModel||localStorage.getItem('GEMINI_MODEL')||DEFAULT_GEMINI_MODEL}
window.setGeminiModel=function(model,scope='default'){if(!model)return;window.AICareerReportConfig=window.AICareerReportConfig||{};if(scope&&scope!=='default')window.AICareerReportConfig[`${scope}GeminiModel`]=model;else window.AICareerReportConfig.geminiModel=model;localStorage.setItem('GEMINI_MODEL',model)}

// ================= 화면 내용 관리 영역 =================
// 사이드바를 클릭했을 때 보이는 화면의 제목, 설명, 안내 문구는 여기서 수정합니다.
// 아래 문구만 바꾸면 연결된 화면 전체에 자동 반영됩니다.
function sc(section){return SCREEN_CONTENT[section]||{}}
function flowCardsHtml(){return (sc('dashboard').flowCards||[]).map(card=>`<div class="module-card"><h3>${escapeHtml(card.title)}</h3><p>${escapeHtml(card.desc)}</p></div>`).join('')}
function moduleDescription(type){return (sc('modules').moduleDesc||{})[type]||''}
const state={view:'landing',user:null,active:'dashboard',activeModule:'interest',selectedParticipantId:null,currentReport:null,editMode:false,reportMenuOpen:true,jobResults:[],lastJobQuery:null,history:[],data:{participants:[{id:'session_client',name:'내담자',age:'미저장',status:'검사결과 분석',docStatus:'미저장',target:'',career:'',memo:'',createdAt:today()}],reports:[]}};
function uid(){return'id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36)}function today(){return new Date().toISOString().slice(0,10)}function escapeHtml(str=''){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function reportBrandHeader(title='AI Career Solution Report'){return `<div class="report-brand-header"><img src="${BRAND_LOGO}" alt="${BRAND_NAME}" class="report-brand-logo"><div><div class="report-brand-text">${BRAND_SUBTITLE} Report</div><div class="report-brand-name">${escapeHtml(title)}</div></div></div>`}function withReportBrand(html,title='AI Career Solution Report'){if(!html)return html;if(String(html).includes('report-brand-header'))return html;return reportBrandHeader(title)+html}function storageDefaults(){return{participants:[{id:'session_client',name:'내담자',age:'미저장',status:'검사결과 분석',docStatus:'미저장',target:'',career:'',memo:'',createdAt:today()}],reports:[],jobMatches:[],accounts:[]}}
function load(){let saved=null;try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(err){saved=null}state.data=saved&&typeof saved==='object'?{...storageDefaults(),...saved}:storageDefaults();ensureDefaults();state.selectedParticipantId=state.data.participants[0]?.id||'session_client';state.view='landing';persist()}
function ensureDefaults(){if(!Array.isArray(state.data.participants)||!state.data.participants.length)state.data.participants=storageDefaults().participants;if(!Array.isArray(state.data.reports))state.data.reports=[];if(!Array.isArray(state.data.jobMatches))state.data.jobMatches=[];if(!Array.isArray(state.data.accounts))state.data.accounts=[];if(!state.data.accounts.some(a=>a.role==='관리자'))state.data.accounts.unshift({id:uid(),loginId:'admin',password:'admin123',name:'관리자',role:'관리자',createdAt:today()});if(!state.data.accounts.some(a=>a.role==='상담사'))state.data.accounts.push({id:uid(),loginId:'counselor01',password:'1234',name:'상담사 데모',role:'상담사',createdAt:today()});}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.data));localStorage.setItem('GEMINI_API_KEY',localStorage.getItem('GEMINI_API_KEY')||'')}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}function getParticipant(){return state.data.participants.find(p=>p.id===state.selectedParticipantId)||state.data.participants[0]||null}function reportTypeName(type){return{company:'기업 분석 리포트',interest:'직업선호도검사 리포트',interview:'상황 면접 시뮬레이션',senior:'신중년 경력자산 리포트',success:'취업 성공 사례',jobAnalysis:'직무분석리포트',jobs:'채용정보 매칭'}[type]||'리포트'}

function pageSnapshot(){return{view:state.view,user:state.user?{...state.user}:null,active:state.active,activeModule:state.activeModule,selectedParticipantId:state.selectedParticipantId,currentReport:state.currentReport?{...state.currentReport}:null,editMode:state.editMode,reportMenuOpen:state.reportMenuOpen,jobResults:Array.isArray(state.jobResults)?state.jobResults.map(x=>({...x})):[],lastJobQuery:state.lastJobQuery?{...state.lastJobQuery}:null};}
function pushHistory(){const snap=pageSnapshot();const last=state.history[state.history.length-1];if(!last||JSON.stringify(last)!==JSON.stringify(snap)){state.history.push(snap);if(state.history.length>40)state.history.shift();}}
function restoreSnapshot(snap){state.view=snap.view;state.user=snap.user;state.active=snap.active;state.activeModule=snap.activeModule;state.selectedParticipantId=snap.selectedParticipantId;state.currentReport=snap.currentReport;state.editMode=snap.editMode;state.reportMenuOpen=snap.reportMenuOpen;state.jobResults=snap.jobResults||[];state.lastJobQuery=snap.lastJobQuery||null;}
function goBack(){if(!state.history.length){toast('이전 페이지가 없습니다.');return}const snap=state.history.pop();restoreSnapshot(snap);render();}
function goLanding(){pushHistory();state.user=null;state.view='landing';render();}
function render(){const app=document.getElementById('app');if(state.view==='landing'){app.innerHTML=renderLanding();return}if(state.view==='login'&&!state.user){app.innerHTML=renderCounselorLogin();return}app.innerHTML=renderApp();activateSection(state.active)}
function renderLanding(){return landingTemplate()}
function renderCounselorLogin(){return loginTemplate()}
function renderApp(){return shellTemplate()}



function landingNavLinksHtml() {
  return LANDING_CONTENT.nav
    .map(item => `<a href="${item.href}">${item.label}</a>`)
    .join('');
}

function landingCheckListHtml(items) {
  return items.map(item => `<li>${item}</li>`).join('');
}

function landingChipRowHtml(items) {
  return items.map(item => `<span class="real-chip">${item}</span>`).join('');
}

function landingReportSectionHtml(report) {
  return `
    <section class="real-report-section" id="${report.id}">
      <div class="${report.layoutClass}">
        <div class="real-report-copy">
          <div class="kicker">${report.kicker}</div>
          <h2>${report.title}</h2>
          <p>${report.description}</p>
          <ul class="check-list">
            ${landingCheckListHtml(report.checks)}
          </ul>
          <div class="real-chip-row">
            ${landingChipRowHtml(report.chips)}
          </div>
        </div>
        <div class="real-report-image">
          <img src="${LANDING_IMAGES[report.imageKey]}" alt="${report.imageAlt}">
        </div>
      </div>
    </section>`;
}

function landingQualityCardsHtml() {
  return LANDING_CONTENT.quality.cards
    .map(card => `
      <div class="quality-card">
        <span class="num">${card.number}</span>
        <h3>${card.title}</h3>
        <p>${card.description}</p>
      </div>`)
    .join('');
}

function landingFeatureStripHtml() {
  return LANDING_CONTENT.featureStrip
    .map(item => `
      <div class="real-feature-item">
        <strong>${item.title}</strong>
        <span>${item.description}</span>
      </div>`)
    .join('');
}
function landingTemplate() {
  const content = LANDING_CONTENT;
  const reports = content.reports;

  return `
    <div class="landing pro-landing">
      <header class="landing-nav">
        <div class="logo">
          <img src="${BRAND_LOGO}" alt="${BRAND_NAME}" class="brand-logo landing-logo">
        </div>
        <nav class="landing-nav-links">
          ${landingNavLinksHtml()}
          <button class="btn" onclick="goLogin()">${content.buttons.login}</button>
        </nav>
      </header>

      <section class="real-hero">
        <div class="real-hero-inner">
          <div class="real-hero-copy">
            <span class="real-hero-badge">${content.hero.badge}</span>
            <h1>${content.hero.title}</h1>
            <p>${content.hero.description}</p>
            <div class="actions">
              <button class="btn" onclick="goLogin()">${content.buttons.start}</button>
              <a class="btn secondary" href="#company-report">${content.buttons.viewReport}</a>
            </div>
          </div>
          <div class="real-hero-image">
            <img src="${LANDING_IMAGES.hero}" alt="${content.hero.imageAlt}">
          </div>
        </div>
      </section>

      ${landingReportSectionHtml(reports.company)}
      ${landingReportSectionHtml(reports.success)}

      <section class="pro-section" id="${content.quality.id}">
        <div class="pro-section-header">
          <h2>${content.quality.title}</h2>
          <p>${content.quality.description}</p>
        </div>
        <div class="quality-grid">
          ${landingQualityCardsHtml()}
        </div>
      </section>

      <section class="real-feature-strip">
        ${landingFeatureStripHtml()}
      </section>

      <section class="landing-cta">
        <div>
          <h2>${content.cta.title}</h2>
          <p>${content.cta.description}</p>
        </div>
        <button class="btn secondary" onclick="goLogin()">${content.buttons.start}</button>
      </section>

      <footer class="landing-footer">
        <strong>${content.footer.brand}</strong><br>
        ${content.footer.description}
      </footer>
    </div>`;
}
function goLogin(){pushHistory();state.view='login';state.user=null;render()}
function goLanding(){pushHistory();state.user=null;state.view='landing';render()}
function loginTemplate(){const content=LANDING_CONTENT;const loginId='counselor01';const password='1234';const title='상담사 로그인';const desc='발급받은 상담사 아이디와 비밀번호로 접속합니다.';const demo='상담사: counselor01 / 1234';return `<div class="login-screen"><section class="login-hero"><div class="real-hero-copy"><span class="real-hero-badge">${content.hero.badge}</span><h1>${content.hero.title}</h1><p>${content.hero.description}</p><div class="actions"><button class="btn" onclick="document.getElementById('loginId')?.focus()">${content.buttons.start}</button><a class="btn secondary" href="#" onclick="goLanding();return false">${content.buttons.viewReport}</a></div></div><div class="real-hero-image"><img src="${LANDING_IMAGES.hero}" alt="${content.hero.imageAlt}"></div></section><section class="login-panel"><div class="login-box"><h2>${title}</h2><p>${desc}</p><div class="field"><label>아이디</label><input id="loginId" value="${loginId}" autocomplete="username"></div><div class="field"><label>비밀번호</label><input id="loginPw" type="password" value="${password}" autocomplete="current-password"></div><button class="btn full" onclick="login()">접속하기</button><button class="btn secondary full" onclick="goLanding()" style="margin-top:8px">첫 화면으로 돌아가기</button><div class="demo-info"><strong>시연용 계정</strong><br>${demo}</div></div></section></div>`}function login(){const loginId=document.getElementById('loginId').value.trim();const password=document.getElementById('loginPw').value;const acc=(state.data.accounts||[]).find(a=>a.loginId===loginId&&a.password===password);if(!acc){toast('아이디 또는 비밀번호가 올바르지 않습니다.');return}const expectedRole=APP_ROLE==='admin'?'관리자':'상담사';if(acc.role!==expectedRole){toast(`${expectedRole} 계정으로만 접속할 수 있습니다.`);return}pushHistory();state.user={accountId:acc.id,loginId:acc.loginId,name:acc.name,role:acc.role};state.view='app';state.active=APP_ROLE==='admin'?'admin':'dashboard';if(!state.selectedParticipantId&&state.data.participants[0])state.selectedParticipantId=state.data.participants[0].id;render()}
function logout(){pushHistory();state.user=null;state.view='landing';render()}
function navButton(id,label){return `<button class="${state.active===id?'active':''}" onclick="setSection('${id}')"><span>${label} (준비중)</span><span>›</span></button>`}function subNavButton(module,label){return `<button class="${state.active==='modules'&&state.activeModule===module?'active':''}" onclick="setReportModule('${module}')"><span>${['interest','success'].includes(module)?label:label+' (준비중)'}</span></button>`}function setReportModule(module){if(state.active!=='modules'||state.activeModule!==module)pushHistory();state.active='modules';state.activeModule=module;state.currentReport=null;state.editMode=false;render()}function toggleReportMenu(){state.reportMenuOpen=!state.reportMenuOpen;if(state.reportMenuOpen)state.active='modules';render()}function goDashboard(){if(state.active!=='dashboard')pushHistory();state.active='dashboard';state.activeModule='interest';state.currentReport=null;state.editMode=false;state.reportMenuOpen=false;render()}function shellTemplate(){const sideBrand=`<div class="side-brand" role="button" tabindex="0" aria-label="메인 대시보드로 이동" onclick="goDashboard()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goDashboard()}"><img src="${BRAND_LOGO}" alt="${BRAND_NAME}" class="sidebar-logo"><div class="title">${BRAND_NAME}</div><div class="sub">${BRAND_SUBTITLE}</div><div class="role-badge">${escapeHtml(state.user.name)} · ${escapeHtml(state.user.role)}</div></div>`;if(APP_ROLE==='admin')return `<div class="shell"><aside class="sidebar no-print">${sideBrand}<nav class="nav"><button class="active" onclick="setSection('admin')"><span>관리자 현황</span><span>›</span></button></nav><div style="margin-top:20px;padding:10px"><button class="btn secondary full" onclick="logout()">로그아웃</button></div></aside><main class="main">${adminSection()}</main></div>`;const reportMenuStyle=state.reportMenuOpen?'':'style="display:none"';return `<div class="shell"><aside class="sidebar no-print">${sideBrand}<nav class="nav"><button class="${state.active==='modules'?'active':''}" onclick="toggleReportMenu()"><span>리포트 생성 (Beta)</span><span>${state.reportMenuOpen?'⌃':'⌄'}</span></button><div class="subnav" ${reportMenuStyle}>${subNavButton('interest','직업선호도검사 리포트(Beta)')}${subNavButton('success','취업 성공 사례(Beta)')}${subNavButton('task','직무 분석 리포트')}${subNavButton('interview','상황 면접 시뮬레이션')}</div>${navButton('jobs','채용정보 매칭')}${navButton('account','내 계정')}</nav><div style="margin-top:20px;padding:10px"><button class="btn secondary full" onclick="logout()">로그아웃</button></div></aside><main class="main">${dashboardSection()}${modulesSection()}${jobMatchingSection()}${accountSection()}</main></div>`}function setSection(id){if(state.active!==id)pushHistory();state.active=id;render()}function activateSection(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));const el=document.getElementById('section-'+id);if(el)el.classList.add('active')}function pageTitle(title,desc,actions=''){const backBtn=state.history&&state.history.length?`<button class="btn secondary" onclick="goBack()">← 뒤로가기</button>`:'';return `<div class="topbar no-print"><div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${backBtn}${actions}</div></div>`}
function workspaceIcon(name){const icons={intake:'<path d="M7 4h10v4H7z"></path><path d="M6 8h12v12H6z"></path><path d="M9 12h6"></path><path d="M9 16h4"></path>',analyze:'<circle cx="11" cy="11" r="5"></circle><path d="M15 15l4 4"></path><path d="M11 8v6"></path><path d="M8 11h6"></path>',draft:'<path d="M5 4h10l4 4v12H5z"></path><path d="M15 4v4h4"></path><path d="M8 13h8"></path><path d="M8 17h6"></path>',deliver:'<path d="M4 5h16v14H4z"></path><path d="M8 9h8"></path><path d="M8 13h5"></path><path d="M16 16l2 2 3-4"></path>',interest:'<path d="M12 3l8 5v8l-8 5-8-5V8z"></path><path d="M12 7v10"></path><path d="M7.5 10l9 4"></path><path d="M16.5 10l-9 4"></path>',success:'<path d="M4 18V6"></path><path d="M4 18h16"></path><path d="M7 15l3-4 3 2 5-7"></path><path d="M16 6h2v2"></path>',job:'<path d="M8 7V5h8v2"></path><path d="M4 8h16v10H4z"></path><path d="M9 12h6"></path><path d="M12 8v10"></path>',interview:'<path d="M5 6h14v9H8l-3 3z"></path><path d="M9 10h6"></path><path d="M9 13h4"></path>'};return `<svg class="workspace-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.draft}</svg>`}
function workflowStep(icon,title,desc){return `<div class="workflow-step"><span class="workflow-icon">${workspaceIcon(icon)}</span><div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(desc)}</span></div></div>`}
function dashboardQuickCard(module,icon,title,desc){return `<button class="quick-card" onclick="setReportModule('${module}')"><span class="quick-icon">${workspaceIcon(icon)}</span><strong>${escapeHtml(title)}</strong><span>${escapeHtml(desc)}</span></button>`}
function dashboardSection(){const name=state.user?.name||'상담사';return `<section id="section-dashboard" class="section"><div class="ai-workspace"><div class="workspace-hero"><div><div class="workspace-kicker">RE:WORK AI COUNSELING</div><h1>안녕하세요, ${escapeHtml(name)}님.<br><span class="hero-emphasis">오늘도 AI와 함께 상담 리포트를 빠르게 생성해보세요.</span></h1><p>AI가 초안을 만들고, 상담사가 바로 편집 가능한 리포트로 정리합니다.</p></div><div class="workspace-visual"><div class="workspace-logo-card"><img src="${BRAND_LOGO}" alt="${BRAND_NAME}" class="workspace-logo"><div class="workspace-report-lines"><span></span><span></span><span></span></div></div></div></div><div class="workspace-block"><div class="workspace-head"><div><h3>상담 워크플로우</h3><p>내담자 정보 확인부터 리포트 전달까지 한 화면에서 빠르게 이어갑니다.</p></div></div><div class="workflow-grid">${workflowStep('intake','정보 확인','기본 정보와 상담 메모를 정리합니다.')}${workflowStep('analyze','AI 분석','검사 결과와 경력 조건을 통합합니다.')}${workflowStep('draft','초안 편집','AI 리포트 초안을 상담사가 다듬습니다.')}${workflowStep('deliver','저장·출력','PDF 저장과 인쇄로 전달합니다.')}</div></div><div class="workspace-block"><div class="workspace-head"><div><h3>빠른 실행</h3><p>자주 사용하는 AI 리포트 생성 화면으로 바로 이동합니다.</p></div></div><div class="quick-grid">${dashboardQuickCard('interest','interest','직업선호도검사 리포트','흥미·성격·생활사 검사를 통합 분석하여 진로 방향과 직무 적합성을 제시합니다.')}${dashboardQuickCard('success','success','취업 성공사례','유사한 경력과 조건의 성공사례를 검색하고 맞춤형 인사이트를 제공합니다.')}${dashboardQuickCard('jobAnalysis','job','직무 분석 리포트','희망 직무와 경력을 기반으로 직무 적합성, 필요 역량, 준비 방향을 분석합니다.')}${dashboardQuickCard('interview','interview','상황면접 시뮬레이션','직무별 예상 질문과 모범 답변을 생성하여 면접 준비를 도와드립니다.')}</div></div><div class="workspace-block"><div class="workspace-head"><div><h3>AI 지원 기능</h3><p>생성부터 편집, 출력까지 상담사 업무 흐름에 맞춰 지원합니다.</p></div></div><div class="ai-support-tags"><span class="ai-support-tag">검사 결과 통합 분석</span><span class="ai-support-tag">AI 초안 자동 생성</span><span class="ai-support-tag">상담사 편집 가능</span><span class="ai-support-tag">PDF 저장 및 출력 지원</span></div></div></div></section>`}function recentReportsPanel(){const rows=state.data.reports.slice(0,5).map(r=>`<tr><td>${escapeHtml(r.createdAt)}</td><td>${escapeHtml(r.participantName)}</td><td><span class="pill">${reportTypeName(r.type)}</span></td><td>${escapeHtml(r.title)}</td><td><button class="btn light" onclick="openReport('${r.id}')">열기</button></td></tr>`).join('');return `<div class="panel"><div class="panel-head"><h3>최근 생성 리포트</h3><button class="btn secondary" onclick="setSection('reports')">전체 보기</button></div><div class="panel-body">${rows?`<div class="table-wrap"><table><thead><tr><th>생성일</th><th>참여자</th><th>유형</th><th>제목</th><th>작업</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">아직 생성된 리포트가 없습니다.</div>`}</div></div>`}

t||'';document.getElementById('pCareer').value=p.career||'';document.getElementById('pMemo').value=p.memo||''},0)}function resetParticipantForm(){['participantId','pName','pTarget','pCareer','pMemo'].forEach(id=>document.getElementById(id).value='');document.getElementById('pAge').value='20대';document.getElementById('pStatus').value='구직중';document.getElementById('pDoc').value='기본정보 미입력'}function deleteParticipant(id){if(!confirm('참여자를 삭제할까요? 관련 리포트는 유지됩니다.'))return;state.data.participants=state.data.participants.filter(p=>p.id!==id);if(state.selectedParticipantId===id)state.selectedParticipantId=state.data.participants[0]?.id||null;persist();toast('삭제되었습니다.');render()}function selectParticipant(id){pushHistory();state.selectedParticipantId=id;persist();state.active='modules';render();toast('참여자가 선택되었습니다.')}

async function generateReport(type, priority){let p=getParticipant();if(!p){toast('내담자 분석 정보를 찾을 수 없습니다.');return}let html='',title='';if(type==='company'){const company=val('companyName');if(!company){toast('기업명을 입력해주세요.');return}const job=val('companyJob')||p.target||'지원 희망 직무';title=`${company} 기업 분석 리포트`;html=companyReport(p,company,job,val('companyUrl'),val('companyJD'),val('companyReq'))}if(type==='interest'){const selectedHasTarget=val('interestHasTarget')==='yes';const targetJob=val('interestTarget');const hasTargetJob=selectedHasTarget&&targetJob&&targetJob.trim().length>0;const target=hasTargetJob?targetJob:'검사 결과 기반 추천 직무';p=getInterestClient();try{const generated=hasTargetJob?(USE_MOCK_DATA===true?generateInterestReportMock(p,target,true):await generateGeminiInterestReport(p,target,true)):await generateNoTargetJobInterestReport(p);title=hasTargetJob?`${p.name} 직업선호도검사 리포트 (${target})`:generated.title;html=withReportBrand(generated.html,title);state.currentReport={id:null,type:'interest',title,participantId:p.id,participantName:p.name,html,createdAt:today()}}catch(err){toast(err.message||'Gemini 분석 중 오류가 발생했습니다.');return}}if(type==='interview'){const job=val('interviewJob');if(!job){toast('지원 희망 직무를 입력해주세요.');return}title=`${job} ${val('interviewType')} 답변 가이드`;html=interviewReport(p,job,val('interviewType'),val('interviewLevel'),val('interviewSituation')||'직무 수행 중 문제 상황',val('interviewReq'))}if(type==='senior'){const career=val('seniorCareer');if(!career){toast('주요 경력을 입력해주세요.');return}title=`${p.name} 신중년 경력자산 리포트`;html=seniorReport(p,career,val('seniorAssets'),val('seniorDirection'),val('seniorReq'))}if(type==='jobAnalysis'){const target=val('jobAnalysisTarget')||p.target;if(!target){toast('희망 직무를 입력해주세요.');return}try{const generated=await generateGeminiJobAnalysis(p,target);title=generated.title;html=generated.html}catch(err){toast(err.message||'Gemini 분석 중 오류가 발생했습니다.');return}}if(type==='success'){const query=val('successJobKeyword');if(!query){toas function normalizeNoTargetJobReportData(raw){const r=raw||{};const mock=mockNoTargetJobReport;const personality=r.personalityTest||mock.personalityTest||{};const life=r.lifeHistoryTest||mock.lifeHistoryTest||{};const normalized={reportTitle:r.reportTitle||'직업선호도검사(L형) 진로 탐색형 분석 리포트',participantInfo:{...mock.participantInfo,...(r.participantInfo||{}),targetJobStatus:(r.participantInfo?.targetJobStatus)||'희망 직무 없음'},interestTest:{...mock.interestTest,...(r.interestTest||{}),scores:{...mock.interestTest.scores,...(r.interestTest?.scores||{})}},personalityTest:{...mock.personalityTest,...personality,isProvided:personality.isProvided!==undefined?!!personality.isProvided:!!personality.summary},lifeHistoryTest:{...mock.lifeHistoryTest,...life,isProvided:life.isProvided!==undefined?!!life.isProvided:!!life.summary},integratedAnalysis:r.integratedAnalysis||'',swot:{...mock.swot,...(r.swot||{})},jobFitKeywords:{...mock.jobFitKeywords,...(r.jobFitKeywords||{})},recommendedJobs:Array.isArray(r.recommendedJobs)&&r.recommendedJobs.length?r.recommendedJobs:mock.recommendedJobs,aiLifeQuestions:Array.isArray(r.aiLifeQuestions)&&r.aiLifeQuestions.length?r.aiLifeQuestions:mock.aiLifeQuestions,counselorNotice:r.counselorNotice||'본 리포트는 AI가 분석한 데이터이며 내용에 대한 최종 평가는 전문가에게 있습니다.'};normalized.recommendedJobs=normalized.recommendedJobs.map(job=>({title:job.title||job.job||'',reason:job.reason||'',relatedStrength:job.relatedStrength||job.strength||'검사 결과 기반 강점과 연결',preparation:job.preparation||job.prep||'관련 채용공고 비교와 필요 역량 확인'}));normalized.aiLifeQuestions=normalized.aiLifeQuestions.map(q=>typeof q==='string'?{question:q,intent:'검사 결과와 실제 경험의 연결성을 확인하기 위함',counselorUse:'구체적 사례, 당시 감정, 성과를 함께 확인합니다.'}:{question:q.question||'',intent:q.intent||'검사 결과와 실제 경험의 연결성을 확인하기 위함',counselorUse:q.counselorUse||'상담 장면에서 실행 가능한 탐색 과제로 연결합니다.'});return normalized}

')}</td><td>${score(r.interestTest.scores,'C','raw')}</td></tr><tr><th>표준점수</th><td>${score(r.interestTest.scores,'R','standard')}</td><td>${score(r.interestTest.scores,'I','standard')}</td><td>${score(r.interestTest.scores,'A','standard')}</td><td>${score(r.interestTest.scores,'S','standard')}</td><td>${score(r.interestTest.scores,'E','standard')}</td><td>${score(r.interestTest.scores,'C','standard')}</td></tr></tbody></table><h3>흥미 기반 강점</h3>${list(r.interestTest.strengths)}<h3>선호 활동</h3>${list(r.interestTest.preferredActivities)}<h3>피로 가능 활동</h3>${list(r.interestTest.avoidActivities)}${showPersonality?`<h2>3. 성격검사 결과</h2><p>${escapeHtml(r.personalityTest.summary)}</p><table><thead><tr><th>주요코드</th><th>외향성</th><th>호감성</th><th>성실성</th><th>정서적 불안정성</th><th>경험에 대한 개방성</th></tr></thead><tbody><tr><th>원점수</th><td>${escapeHtml(pScores.extroversion??'')}</td><td>${escapeHtml(pScores.agreeableness??'')}</td><td>${escapeHtml(pScores.conscientiousness??'')}</td><td>${escapeHtml(pScores.emotionalInstability??'')}</td><td>${escapeHtml(pScores.openness??'')}</td></tr></tbody></table><h3>성격 기반 강점</h3>${list(r.personalityTest.strengths)}<h3>자연스럽게 잘할 가능성이 높은 행동</h3>${list(r.personalityTest.naturalBehaviors)}<h3>자주 들었을 가능성이 있는 칭찬</h3>${list(r.personalityTest.praisedFor)}<h3>인정받기 쉬운 업무</h3>${list(r.personalityTest.recognizedWork)}`:''}${showLife?`<h2>4. 생활사검사 요약</h2><p>${escapeHtml(r.lifeHistoryTest.summary)}</p><table><thead><tr><th>주요코드</th><th>대인관계</th><th>독립심</th><th>가족친화</th><th>야망</th><th>학업성취</th><th>예술성</th><th>운동선호</th><th>종교성</th><th>직무만족</th></tr></thead><tbody><tr><th>원점수</th><td>${escapeHtml(lScores.relationship??'')}</td><td>${escapeHtml(lScores.independence??'')}</td><td>${escapeHtml(lScores.family??'')}</td><td>${escapeHtml(lScores.ambition??'')}</td><td>${escapeHtml(lScores.academicAchievement??'')}</td><td>${escapeHtml(lScores.artistry??'')}</td><td>${escapeHtml(lScores.sports??'')}</td><td>${escapeHtml(lScores.religion??'')}</td><td>${escapeHtml(lScores.jobSatisfaction??'')}</td></tr></tbody></table><p>${escapeHtml(r.lifeHistoryTest.growthPattern)}</p>`:''}<h2>5. 흥미 기반 진로 탐색 분석</h2><p>${escapeHtml(r.integratedAnalysis||r.interestTest.shapeAnalysis)}</p>${showPersonality||showLife?`<h2>6. 선택 검사 기반 추가 분석</h2><p>${escapeHtml([r.personalityTest.summary,r.lifeHistoryTest.growthPattern].filter(Boolean).join(' '))}</p>`:''}<h2>7. 개인특성 SWOT 분석</h2><table><tbody><tr><th>Strengths 강점</th><th>Weaknesses 약점</th></tr><tr><td>${swotCell(r.swot.strengths)}</td><td>${swotCell(r.swot.weaknesses)}</td></tr><tr><th>Opportunities 기회</th><th>Threats 위협</th></tr><tr><td>${swotCell(r.swot.opportunities)}</td><td>${swotCell(r.swot.threats)}</td></tr></tbody></table><h2>8. 역량기반 추천직업</h2><table><thead><tr><th>추천직업</th><th>추천 근거</th><th>관련 강점</th><th>준비 방향</th></tr></thead><tbody>${(r.recommendedJobs||[]).map(job=>`<tr><td>${escapeHtml(job.title)}</td><td>${escapeHtml(job.reason)}</td><td>${escapeHtml(job.relatedStrength)}</td><td>${escapeHtml(job.preparation)}</td></tr>`).join('')}</tbody></table><h2>9. AI 인생질문</h2><table><thead><tr><th>질문</th><th>질문 의도</th><th>상담사 활용 방법</th></tr></thead><tbody>${(r.aiLifeQuestions||[]).map(q=>`<tr><td>${escapeHtml(q.question)}</td><td>${escapeHtml(q.intent)}</td><td>${escapeHtml(q.counselorUse)}</td></tr>`).join('')}</tbody></table><p class="small">${escapeHtml(r.counselorNotice)}</p>`}
function noTargetCoverDataUri(){return 'assets/no-target-cover.svg'}
renderNoTargetJobReportFromData=function(report,{mockMode=false}={}){const r=normalizeNoTargetJobReportData(report);const pi=r.participantInfo;const esc=escapeHtml;const list=items=>`<ul>${(items||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;const score=(key,field)=>esc(r.interestTest.scores?.[key]?.[field]??'');const pScores=r.personalityTest.scores||{};const lScores=r.lifeHistoryTest.scores||{};const jobs=r.recommendedJobs||[];const integrated=[`관습형 78점과 독립심 80점의 조합은 김소연 내담자가 타인의 지시를 기다리기보다 스스로 기준을 세우고, 자료와 절차를 체계적으로 정리할 때 안정감을 느낄 가능성을 보여줍니다. 현재 직업상담사 경험 안에서도 사람을 직접 설득하는 장면보다 상담 기록, 사업 운영 기준, 사례 데이터 정리처럼 구조가 분명한 과업에서 더 편안함을 느낄 수 있습니다. 따라서 진로 탐색의 첫 기준은 “사람을 돕는 일” 자체보다 “사람과 조직을 돕기 위해 정보를 체계화하는 일”로 잡아볼 수 있습니다.`,`탐구형 61점과 성실성 65점은 단순 반복 행정보다 자료를 읽고 의미를 찾아 정리하는 업무에서 몰입이 생길 가능성을 더해줍니다. 특히 규정, 매뉴얼, 평가 기준, HR 데이터처럼 정답이 완전히 열려 있지는 않지만 분석과 해석이 필요한 자료를 다룰 때 강점을 보일 수 있습니다. 반대로 목표가 자주 바뀌거나 기준이 모호한 환경, 즉흥적 설득과 감정노동이 큰 역할에서는 에너지 소모와 피로감이 커질 수 있어 주의가 필요합니다.`,`진로 방향은 직업상담 경력을 버리는 방식보다 상담 경험을 백오피스 전문성, 데이터 구조화, 교육 및 고용서비스 운영으로 확장하는 방식이 자연스럽게 이어질 수 있습니다. HR 데이터 분석, 전직지원 컨설팅, 에듀테크 운영, 정부위탁사업 PM, 심사평가 업무처럼 사람과 제도를 이해하면서도 명확한 기준과 자료를 다루는 분야를 탐색해볼 수 있습니다. 앞으로는 관심 직무명을 바로 확정하기보다 실제 채용공고의 반복 과업을 비교하며 “정리, 분석, 운영, 평가” 비중이 높은 역할부터 좁혀가는 전략이 적절합니다.`];return `<!-- report-brand-header --><div class="no-target-report"><section class="no-target-cover-page"><img class="no-target-cover-img" src="${noTargetCoverDataUri()}" alt="직업선호도 검사 상담 안내 가이드 표지"></section><section class="no-target-page"><h2>1. 참여자 정보</h2><table class="no-target-info"><tbody><tr><th>내담자명</th><td>${esc(pi.name)}</td><th>검사일시</th><td>${esc(pi.testDate)}</td></tr><tr><th>나이</th><td>${esc(pi.age)}</td><th>학력</th><td>${esc(pi.education)}</td></tr><tr><th>현직업</th><td>${esc(pi.currentJob)}</td><th>희망직무 기준</th><td>${esc(pi.targetJobStatus)}</td></tr><tr><th>핵심 코드</th><td>${esc(String(pi.coreCode||'').replace(/\s*\\(.+\\)/,''))}</td><th>대표 코드</th><td>${esc(r.interestTest.representativeCode)}</td></tr></tbody></table><h2>2. 흥미검사 결과 요약</h2><div class="guide-note"><p><strong>형태 분석:</strong> ${esc(r.interestTest.shapeAnalysis)}</p><p><strong>상담 참고 유형:</strong> ${esc(r.interestTest.celebrityType)}</p></div><table><thead><tr><th>주요코드</th><th>R</th><th>I</th><th>A</th><th>S</th><th>E</th><th>C</th></tr></thead><tbody><tr><th>원점수</th><td>${score('R','raw')}</td><td>${score('I','raw')}</td><td>${score('A','raw')}</td><td>${score('S','raw')}</td><td>${score('E','raw')}</td><td>${score('C','raw')}</td></tr><tr><th>표준점수</th><td>${score('R','standard')}</td><td>${score('I','standard')}</td><td>${score('A','standard')}</td><td>${score('S','standard')}</td><td>${score('E','standard')}</td><td>${score('C','standard')}</td></tr></tbody></table><div class="dense-copy"><p>김소연 내담자의 흥미는 관습형 C가 매우 높고, 탐구형 I가 그 뒤를 받치는 구조로 해석됩니다. 이는 단순히 “사무를 좋아한다”는 뜻을 넘어, 흩어진 자료를 기준에 맞게 정리하고 오류 없이 관리하는 과정에서 안정감과 몰입을 느낄 가능성을 보여줍니다.</p><p>사회형 S는 원점수 기준으로 의미 있게 나타나지만, 주도적인 대면 설득이나 감정노동보다는 상담 기록, 제도 안내, 사례 관리처럼 사람을 돕는 일을 체계와 문서로 뒷받침할 때 더 자연스럽게 발휘될 수 있습니다. 따라서 ‘사람을 직접 이끄는 역할’보다 ‘사람을 돕는 시스템을 정교하게 운영하는 역할’을 우선 탐색해볼 수 있습니다.</p><p>현실형 R과 예술형 A가 낮게 나타난 점은 기계·장비 중심의 현장 업무나 높은 즉흥성을 요구하는 창작 중심 직무에서 피로감을 느낄 수 있음을 시사합니다. 반대로 규정, 데이터, 절차, 평가 기준이 분명한 환경에서는 내담자의 꼼꼼함과 책임감이 직무 만족으로 이어질 가능성이 있습니다.</p></div><div class="detail-grid"><div class="detail-card"><strong>이럴 때 능력을 발휘합니다.</strong>복잡한 정보를 체계로 바꾸고 기준에 맞게 관리하는 상황에서 안정적인 수행 가능성이 있습니다.</div><div class="detail-card"><strong>이럴 때 편안함을 느낍니다.</strong>규칙을 만들거나 따르는 활동, 데이터 분류, 정보 분석에서 더 편안함을 느낄 수 있습니다.</div><div class="detail-card"><strong>이럴 때 에너지 소모가 큽니다.</strong>기계기술적 활동이나 목표와 기준이 모호한 과제에서는 피로감을 느낄 수 있습니다.</div><div class="detail-card"><strong>더 알아보면 좋아요.</strong>HR 데이터, 교육운영, 사업관리, 심사평가처럼 자료와 제도를 함께 다루는 분야를 살펴볼 수 있습니다.</div></div></section><section class="no-target-page"><h2>3. 성격검사 결과</h2><p>${esc(r.personalityTest.summary)}</p><table><thead><tr><th>주요코드</th><th>외향성</th><th>호감성</th><th>성실성</th><th>정서적 불안정성</th><th>경험에 대한 개방성</th></tr></thead><tbody><tr><th>원점수</th><td>${esc(pScores.extroversion??'')}</td><td>${esc(pScores.agreeableness??'')}</td><td>${esc(pScores.conscientiousness??'')}</td><td>${esc(pScores.emotionalInstability??'')}</td><td>${esc(pScores.openness??'')}</td></tr></tbody></table><div class="dense-copy"><p>성실성 65점은 맡은 일을 끝까지 책임지고, 기준과 순서를 지키며 완성도를 높이려는 업무 태도로 이어질 가능성이 있습니다. 특히 책임감 73점과 조직화 능력 68점은 일정, 문서, 자료, 규정이 얽힌 업무를 차분히 정리하는 데 강점으로 작용할 수 있습니다.</p><p>호감성 56점은 타인에 대한 기본적인 신뢰와 수용성이 있음을 보여주지만, 외향성 35점은 많은 사람을 동시에 만나거나 계속 설득해야 하는 상황에서 에너지가 빨리 소진될 수 있음을 시사합니다. 따라서 대면 중심의 전면 역할보다 상담·교육·고용서비스를 뒤에서 설계하고 운영하는 역할이 더 편안할 수 있습니다.</p><p>정서적 불안정성 47점은 평균 범위로 보이지만, 불확실한 환경이나 기준이 자주 바뀌는 조직에서는 스트레스 관리가 필요할 수 있습니다. 김소연 내담자는 자유도가 지나치게 큰 환경보다 목표와 평가 기준이 분명한 곳에서 역량을 안정적으로 인정받을 가능성이 있습니다.</p></div><div class="detail-grid"><div class="detail-card"><strong>타고난 것처럼 자연스러워요.</strong>주어진 일을 책임감 있게 받아들이고, 계획과 순서에 따라 단정하게 조직화하는 행동을 자연스럽게 해낼 가능성이 있습니다.</div><div class="detail-card"><strong>이런 칭찬을 많이 받았어요.</strong>성실하고 책임감이 강하다는 평가, 문서 정리와 계획 수립이 정교하다는 칭찬을 자주 들었을 가능성이 있습니다.</div></div><h2>4. 생활사검사 요약</h2><p>${esc(r.lifeHistoryTest.summary)}</p><table><thead><tr><th>주요코드</th><th>대인관계</th><th>독립심</th><th>가족친화</th><th>야망</th><th>학업성취</th><th>예술성</th><th>운동선호</th><th>종교성</th><th>직무만족</th></tr></thead><tbody><tr><th>원점수</th><td>${esc(lScores.relationship??'')}</td><td>${esc(lScores.independence??'')}</td><td>${esc(lScores.family??'')}</td><td>${esc(lScores.ambition??'')}</td><td>${esc(lScores.academicAchievement??'')}</td><td>${esc(lScores.artistry??'')}</td><td>${esc(lScores.sports??'')}</td><td>${esc(lScores.religion??'')}</td><td>${esc(lScores.jobSatisfaction??'')}</td></tr></tbody></table><div class="dense-copy"><p>독립심 80점은 누군가가 세세하게 지시하지 않아도 스스로 계획을 세우고 과제를 완수하려는 방식이 익숙할 가능성을 보여줍니다. 이는 관습형 78점과 결합될 때, 자기만의 기준과 절차를 만들고 그것을 꾸준히 지켜내는 업무 방식으로 나타날 수 있습니다.</p><p>학업성취 61점은 새로운 지식이나 제도를 학습하고, 이를 문서와 기준으로 정리하는 데 비교적 강한 적응력을 보일 가능성을 더합니다. 따라서 새로운 자격, HR 데이터 도구, 정부사업 운영 기준처럼 학습과 구조화가 함께 필요한 영역을 탐색해볼 수 있습니다.</p><p>${esc(r.lifeHistoryTest.growthPattern)}</p></div></section><section class="no-target-page analysis-copy"><h2>5. 종합 분석 결과</h2>${integrated.map(p=>`<p>${esc(p)}</p>`).join('')}<h2>6. 개인특성 SWOT 분석</h2><div class="swot-grid"><div class="swot-box"><strong>Strengths 강점</strong>${list(r.swot.strengths)}</div><div class="swot-box"><strong>Weaknesses 약점</strong>${list(r.swot.weaknesses)}</div><div class="swot-box"><strong>Opportunities 기회</strong>${list(r.swot.opportunities)}</div><div class="swot-box"><strong>Threats 위협</strong>${list(r.swot.threats)}</div></div></section><section class="no-target-page jobs-page"><h2>7. 역량기반 추천직업</h2><table><thead><tr><th>추천직업</th><th>추천 근거</th><th>준비 방향</th></tr></thead><tbody>${jobs.map(job=>`<tr><td>${esc(job.title)}</td><td>${esc(job.reason)}</td><td>${esc(job.preparation||'관련 채용공고를 비교하고 필요한 역량을 확인합니다.')}</td></tr>`).join('')}</tbody></table></section><section class="no-target-section"><h2>8. AI 인생질문</h2><ol class="question-list">${(r.aiLifeQuestions||[]).slice(0,10).map(q=>`<li>${esc(q.question||q)}</li>`).join('')}</ol></section></div>`}

function noTargetGeminiSystemInstruction(){return `너는 고용서비스 현장에서 10년 이상 근무한 직업상담사이자 AI 커리어 컨설턴트다. 사용자가 입력한 직업선호도검사(L형) 점수를 분석한다. 이번 분석은 “희망 직무가 없는 내담자”를 위한 진로 탐색형 리포트다. 직업흥미검사는 필수 데이터이며, 성격검사와 생활사검사는 선택 데이터다. 성격검사 또는 생활사검사가 없는 경우에는 해당 항목을 추측해서 만들지 말고, 직업흥미검사 기반으로만 분석한다. 분석 문체는 상담사가 내담자에게 설명할 수 있는 전문적이고 부드러운 문장으로 작성한다. 단정하지 말고 “가능성이 있습니다”, “추정됩니다”, “탐색해볼 수 있습니다”, “주의가 필요합니다” 표현을 사용한다. 검사 결과만으로 직업을 확정하지 말고, 없는 점수를 지어내지 말고, 희망 직무가 있는 것처럼 분석하지 말고, 마크다운과 HTML은 출력하지 마라. 반드시 지정된 JSON Schema로만 출력한다.`}
function noTargetGeminiUserPrompt(input){return `아래 검사 데이터를 기반으로 “직업선호도검사(L형) 진로 탐색형 분석 리포트”를 생성하라. 직업흥미검사만 있어도 리포트를 완성하고, 성격검사와 생활사검사가 있으면 교차검증 근거에 반영한다. 추천직업은 최소 10개, AI 인생질문은 최소 10개 제시한다. SWOT은 개인특성 기준으로 작성한다. 지정된 JSON Schema의 핵심 분석 항목만 작성하고 별도 전망 섹션이나 추가 적합도 섹션을 만들지 않는다.\n\n[검사 데이터]\n${JSON.stringify(input,null,2)}\n\n[JSON Schema]\n{"reportTitle":"","participantInfo":{"name":"","testDate":"","age":"","education":"","currentJob":"","targetJobStatus":"희망 직무 없음","coreCode":""},"interestTest":{"representativeCode":"","shapeAnalysis":"","scores":{"R":{"raw":0,"standard":0},"I":{"raw":0,"standard":0},"A":{"raw":0,"standard":0},"S":{"raw":0,"standard":0},"E":{"raw":0,"standard":0},"C":{"raw":0,"standard":0}},"strengths":[],"preferredActivities":[],"avoidActivities":[],"celebrityType":""},"personalityTest":{"isProvided":false,"summary":"","scores":{"extroversion":null,"agreeableness":null,"conscientiousness":null,"emotionalInstability":null,"openness":null},"strengths":[],"naturalBehaviors":[],"praisedFor":[],"recognizedWork":[]},"lifeHistoryTest":{"isProvided":false,"summary":"","scores":{"relationship":null,"independence":null,"family":null,"ambition":null,"academicAchievement":null,"artistry":null,"sports":null,"religion":null,"jobSatisfaction":null},"growthPattern":""},"integratedAnalysis":"","swot":{"strengths":[],"weaknesses":[],"opportunities":[],"threats":[]},"jobFitKeywords":{"satisfactionKeywords":[],"fitKeywords":[]},"recommendedJobs":[{"title":"","reason":"","relatedStrength":"","preparation":""}],"aiLifeQuestions":[{"question":"","intent":"","counselorUse":""}],"counselorNotice":"본 리포트는 AI가 분석한 데이터이며 내용에 대한 최종 평가는 전문가에게 있습니다."}`}
async function requestGeminiNoTargetJobReportData(apiKey,input){if(!apiKey)throw new Error('Gemini API 키를 입력하거나 GEMINI_API_KEY 상수를 설정해주세요.');const model=getGeminiModel('interest');const body={system_instruction:{parts:[{text:noTargetGeminiSystemInstruction()}]},contents:[{role:'user',parts:[{text:noTargetGeminiUserPrompt(input)}]}],generationConfig:{temperature:.12,topP:.65,responseMimeType:'application/json'}};const res=await fetchGeminiWithRetry(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data?.error?.message||`Gemini API 오류 (${res.status})`);const text=(data?.candidates?.[0]?.content?.parts||[]).map(part=>part.text||'').join('\n').trim();if(!text)throw new Error('Gemini 응답에서 JSON 내용을 찾지 못했습니다.');return normalizeNoTargetJobReportData(parseGeminiJson(text))}

<h3>저출산 · 고령화 시대</h3><p>생산가능인구 감소로 기업은 기존 인력의 생산성 극대화와 장기근속을 돕는 교육, 경력설계, 웰니스 체계를 강화하고 있습니다. 은퇴 이후 제2 커리어를 설계하려는 중장년층이 늘면서 체계적인 커리어 로드맵을 설계하는 전문가의 가치는 계속 높아질 전망입니다.</p>
<h3>AI · 디지털 전환 시대</h3><p>지식노동 자동화가 빨라질수록 데이터 품질 검증과 인간 중심 맞춤 조율의 희소성이 커집니다. AI 결과물을 기준에 따라 검증하고, 기술을 활용해 조직원의 몰입과 멘탈 케어를 돕는 기획 영역은 내담자의 관습형 강점과 사회형 동기가 함께 살아날 수 있는 영역입니다.</p>
<h2>총평 및 맞춤형 전략</h2>
<p>김소연 내담자는 높은 주도성과 책임감을 바탕으로 혼란스러운 환경 속에서도 질서와 체계를 찾아내는 분석형 인재입니다. 외향적 에너지는 높지 않지만, 자기 영역에 대한 완성도와 기준 준수 역량은 디지털 전환기 조직에서 희소한 강점입니다.</p>
<ul><li><strong>전문성의 디지털 고도화:</strong> 일반 행정이나 단순 상담보다 HR 데이터 분석가, AI 기반 교육서비스 기획자처럼 데이터와 기술을 결합하는 방향이 적합합니다.</li><li><strong>독립적 전문영역 확보:</strong> 다수와 지속 소통하는 관리직보다 커리어 설계 가이드라인 수립, HR 웰니스 설계, 교육운영 품질관리 같은 사내 전문위원형 역할이 맞습니다.</li><li><strong>실행 순서:</strong> 데이터 도구 학습, 직무별 채용공고 분석, 포트폴리오형 리포트 작성, 비대면 상담/교육 운영 경험 확보 순으로 진행합니다.</li></ul>

  return{title:`${clientName} 직업선호도검사 리포트`,html,participantName:clientName};

function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(new Error('파일을 읽을 수 없습니다.'));reader.readAsDataURL(file)})}
function geminiMimeType(file){const name=(file.name||'').toLowerCase();if(file.type)return file.type;if(name.endsWith('.xlsx'))return'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';if(name.endsWith('.xls'))return'application/vnd.ms-excel';if(name.endsWith('.csv'))return'text/csv';if(name.endsWith('.tsv'))return'text/tab-separated-values';if(name.endsWith('.docx'))return'application/vnd.openxmlformats-officedocument.wordprocessingml.document';if(name.endsWith('.txt'))return'text/plain';if(name.endsWith('.png'))return'image/png';if(name.endsWith('.jpg')||name.endsWith('.jpeg'))return'image/jpeg';if(name.endsWith('.webp'))return'image/webp';return'application/octet-stream'}
function getInterestClient(){const hasTarget=val('interestHasTarget')==='yes';const target=hasTarget?val('interestTarget'):'검사 결과 기반 추천 직무';return{id:'session_interest',name:val('interestPersonName')||'내담자',age:val('interestPersonAge')||'미입력',status:'검사결과 분석',docStatus:'직접 입력',target,hasTarget,career:'상담사 직접 입력 검사 결과 기반',memo:val('interestMemo'),createdAt:today()}}function toggleInterestTargetInput(){const wrap=document.getElementById('interestTargetWrap');const input=document.getElementById('interestTarget');const hasTarget=val('interestHasTarget')==='yes';if(wrap)wrap.style.display=hasTarget?'block':'none';if(input&&!hasTarget)input.value=''}function currentReportHtml(){return state.currentReport?.html||emptyReport()}function geminiPromptText(p,target,memo,files,promptItems=JOB_ANALYSIS_PROMPT_ITEMS){const rows=promptItems.map((x,i)=>`${i+1}. ${x.content}${x.note?` / 필수 참고 사항: ${x.note}`:''}`).join('\n');const fileList=files.map(f=>`- ${f.name} (${Math.round(f.size/1024)}KB, ${geminiMimeType(f)})`).join('\n');return `당신은 한국의 커리어 상담사가 사용하는 직무분석리포트 작성 전문가입니다.

function cleanGeminiHtml(text){let out=String(text||'').trim().replace(/^```html\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();if(/<h1|<h2|<table|<ul/i.test(out))return out;const escaped=escapeHtml(out);return escaped.split(/\n{2,}/).map(block=>{const b=block.trim();if(!b)return'';if(/^#{1,3}\s+/.test(b)){const level=Math.min((b.match(/^#+/)||[''])[0].length,3);return`<h${level}>${b.replace(/^#{1,3}\s+/,'')}</h${level}>`}if(/^- /.test(b)){return`<ul>${b.split('\n').filter(Boolean).map(line=>`<li>${line.replace(/^- /,'')}</li>`).join('')}</ul>`}return`<p>${b.replace(/\n/g,'<br>')}</p>`}).join('')}
function parseGeminiJson(text){let raw=String(text||'').trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```$/,'').trim();try{return JSON.parse(raw)}catch(err){const match=raw.match(/\{[\s\S]*\}/);if(match)return JSON.parse(match[0]);throw err}}
async function generateGeminiJobAnalysis(p,target){const apiKey=val('geminiApiKey');const model=val('geminiModel')||getGeminiModel('jobAnalysis');const files=Array.from(document.getElementById('jobAnalysisFiles')?.files||[]);const memo=val('jobAnalysisMemo');if(!apiKey)throw new Error('Gemini API 키를 입력해주세요.');if(!files.length)throw new Error('검사 결과 자료를 추가해주세요.');localStorage.setItem('GEMINI_API_KEY',apiKey);const btn=document.getElementById('jobAnalysisButton');const oldText=btn?btn.textContent:'';if(btn){btn.disabled=true;btn.textContent='Gemini 분석 중...'}try{const parts=[{text:geminiPromptText(p,target,memo,files)}];for(const file of files){if(file.size>20*1024*1024)throw new Error(`${file.name} 파일은 20MB 이하만 사용할 수 있습니다.`);parts.push({text:`검사 결과 파일: ${file.name}`});parts.push({inline_data:{mime_type:geminiMimeType(file),data:await fileToBase64(file)}})}const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts}],generationConfig:{temperature:.25,topP:.9}})});const data=await res.json().catch(()=>({}));if(!res.ok){const msg=data?.error?.message||`Gemini API 오류 (${res.status})`;throw new Error(msg)}const text=(data?.candidates?.[0]?.content?.parts||[]).map(part=>part.text||'').join('\n').trim();if(!text)throw new Error('Gemini 응답에서 리포트 내용을 찾지 못했습니다.');return{title:`${p.name} 직무분석리포트`,html:cleanGeminiHtml(text)}}finally{if(btn){btn.disabled=false;btn.textContent=oldText||'직무분석리포트 생성'}}}
function baseIntro(p){return `<div class="summary-box"><p><strong>참여자:</strong> ${escapeHtml(p.name)} / ${escapeHtml(p.age)} / ${escapeHtml(p.status)}</p><p><strong>희망 방향:</strong> ${escapeHtml(p.target||'미입력')}</p><p><strong>주요 경력:</strong> ${escapeHtml(p.career||'미입력')}</p><p><strong>상담사 메모:</strong> ${escapeHtml(p.memo||'미입력')}</p></div>`}

function listItems(items){return items.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}
function extractKeywords(text){const stop=['그리고','하지만','또는','관련','지원','직무','기업','업무','경험','역량','필요','우대','자격','사항','관리','운영','기반','대한','통해','하는','하고','있는'];const words=(text||'').replace(/[^가-힣A-Za-z0-9\s]/g,' ').split(/\s+/).map(w=>w.trim()).filter(w=>w.length>=2&&!stop.includes(w));const count={};words.forEach(w=>count[w]=(count[w]||0)+1);return Object.entries(count).sort((a,b)=>b[1]-a[1]).map(([w])=>w)}
function companyReport(p,company,job,url,jd,req){const profile=getCompanyProfile(company);const jdKeywords=extractKeywords((jd||'')+' '+job+' '+company).slice(0,8);const keywordTags=jdKeywords.length?jdKeywords.map(k=>`<span class="company-badge">${escapeHtml(k)}</span>`).join(''):'<span class="company-badge">직무 전문성</span><span class="company-badge">협업</span><span class="company-badge">문제해결</span><span class="company-badge">성과관리</span>';return `<h1>${escapeHtml(company)} 기업 분석 리포트</h1>${baseIntro(p)}<h2>1. 기업 개요 및 사업 구조</h2><h3>기업 포지션</h3><p><strong>${escapeHtml(company)}</strong>은(는) <strong>${escapeHtml(profile.industry)}</strong>로 분석됩니다. 입력 기업명, 지원 직무, 채용공고 내용, 상담사 메모를 바탕으로 상담 현장에서 바로 활용할 수 있는 기업·직무 연결 자료로 구성했습니다.</p>${url?`<p><strong>참고 URL:</strong> ${escapeHtml(url)}</p>`:''}<h3>주요 사업/서비스</h3><ul>${listItems(profile.business)}</ul><h3>조직문화 및 일하는 방식</h3><ul>${listItems(profile.culture)}</ul><h2>2. ${escapeHtml(company)} SWOT 분석</h2><h3>Strength 강점</h3><ul>${listItems(profile.strength)}</ul><h3>Weakness 보완점</h3><ul>${listItems(profile.weakness)}</ul><h3>Opportunity 기회</h3><ul>${listItems(profile.opportunity)}</ul><h3>Threat 위협</h3><ul>${listItems(profile.threat)}</ul><h2>3. 시장 및 경쟁 구도</h2><h3>주요 경쟁/비교 대상</h3><ul>${listItems(profile.competitors)}</ul><h3>산업 흐름</h3><p>${escapeHtml(company)} 지원자는 기업의 규모나 인지도만 언급하기보다, 해당 산업에서 고객경험, 운영 효율, 데이터 활용, 기술 전환이 왜 중요한지 설명할 수 있어야 합니다. 특히 ${escapeHtml(job)} 직무는 기업의 사업전략을 실제 성과로 연결하는 역할이라는 점을 강조하는 것이 좋습니다.</p><h2>4. 지원 직무 관점 분석</h2><h3>지원 직무</h3><p><strong>${escapeHtml(job)}</strong></p><h3>핵심 키워드</h3><div>${keywordTags}</div><h3>직무에서 요구될 가능성이 높은 역량</h3><ul><li>기업의 사업 구조를 이해하고 본인의 업무 목표로 번역하는 능력</li><li>내부 부서, 고객, 협력사와의 커뮤니케이션 및 조율 능력</li><li>문제를 수치와 사례로 설명하고 개선안을 제시하는 능력</li><li>기존 경력을 현재 기업의 직무 언어로 재정리하는 능력</li></ul>${jd?`<h3>입력 채용공고/직무기술서 기반 분석</h3><div class="summary-box"><p>${escapeHtml(jd).replaceAll('\n','<br>')}</p></div><p>위 공고에서 반복되는 표현은 자기소개서의 핵심 문장과 면접 답변의 근거로 사용합니다.</p>`:`<h3>채용공고 분석 메모</h3><p>채용공고를 추가로 붙여넣으면 반복 키워드와 우대조건을 더 구체적으로 추출할 수 있습니다. 현재 리포트는 기업명과 지원 직무를 기준으로 1차 분석한 내용입니다.</p>`}<h2>5. 자기소개서·면접 활용 전략</h2><ul><li>지원동기: ${escapeHtml(company)}의 사업 방향과 본인 경력의 접점을 먼저 제시합니다.</li><li>직무역량: ${escapeHtml(p.career||'참여자의 경력')} 중 ${escapeHtml(job)} 직무와 직접 연결되는 성과를 우선 배치합니다.</li><li>입사 후 포부: 추상적 포부보다 3개월 내 파악할 업무, 6개월 내 기여할 개선점을 구체화합니다.</li></ul><h3>예상 면접 질문</h3><ul><li>${escapeHtml(company)}의 사업 중 본인이 가장 관심 있게 본 영역은 무엇입니까?</li><li>${escapeHtml(job)} 직무에서 본인의 기존 경력이 어떻게 활용될 수 있습니까?</li><li>이 기업의 경쟁 환경을 고려할 때 해당 직무가 왜 중요하다고 생각합니까?</li><li>입사 후 가장 먼저 파악해야 할 데이터나 현장 정보는 무엇입니까?</li></ul><h3>상담사 코멘트</h3><p>${escapeHtml(req||'상담사는 참여자의 실제 경험 중 기업 사업방향과 연결되는 사례를 1~2개 선택해 자기소개서와 면접 답변으로 전환하도록 돕습니다.')}</p>`}
function interestLevel(score){if(score<=40)return'낮음(-)';if(score<=59)return'중간(=)';return'높음(+)'}
function interestCode(scores){const labels={R:'현실형',I:'탐구형',A:'예술형',S:'사회형',E:'진취형',C:'관습형'};return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>k).join('')+' ('+Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>labels[k]).join('/')+')'}
function hexChart(scores){const labels={R:['현실형(R)','실행/사물'],I:['탐구형(I)','사고/아이디어'],A:['예술형(A)','창조/표현'],S:['사회형(S)','자선/사람'],E:['진취형(E)','관리/과제'],C:['관습형(C)','동조/자료']};const order=['R','I','A','S','E','C'];const cx=250,cy=240,maxR=150;function pt(i,r){const angle=(-90+i*60)*Math.PI/180;return [cx+Math.cos(angle)*r,cy+Math.sin(angle)*r]}const grids=[20,40,60,80,100].map(v=>`<polygon class="hex-grid" points="${order.map((_,i)=>pt(i,maxR*v/100).join(',')).join(' ')}"></polygon>`).join('');const axes=order.map((_,i)=>{const p=pt(i,maxR);return `<line class="hex-axis" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"></line>`}).join('');const area=order.map((k,i)=>pt(i,maxR*Math.max(0,Math.min(100,scores[k]))/100).join(',')).join(' ');const points=order.map((k,i)=>{const p=pt(i,maxR*Math.max(0,Math.min(100,scores[k]))/100);return `<circle class="hex-point" cx="${p[0]}" cy="${p[1]}" r="4"></circle>`}).join('');const labelSvg=order.map((k,i)=>{const p=pt(i,maxR+42);const align=i===0||i===3?'middle':(i<3?'start':'end');return `<text class="hex-label" x="${p[0]}" y="${p[1]}" text-anchor="${align}">${labels[k][0]}</text><text class="hex-score" x="${p[0]}" y="${p[1]+16}" text-anchor="${align}">${labels[k][1]} · ${scores[k]}점</text>`}).join('');return `<div class="hex-wrap"><svg class="hex-chart" viewBox="0 0 500 470" role="img" aria-label="직업선호도검사 흥미의 육각형 차트"><text x="250" y="24" text-anchor="middle" style="font-size:17px;font-weight:900;fill:#0f2742">흥미의 육각형 모형</text>${grids}${axes}<polygon class="hex-area" points="${area}"></polygon>${points}${labelSvg}<text x="250" y="452" text-anchor="middle" style="font-size:12px;fill:#667085">표준점수 기준: 40 이하 낮음 · 41~59 중간 · 60 이상 높음</text></svg></div>`}
function interestReport(p,scores,job1,job2){const labels={R:'현실형',I:'탐구형',A:'예술형',S:'사회형',E:'진취형',C:'관습형'};const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const top=sorted.slice(0,2).map(([k,v])=>`${labels[k]}(${k}) ${v}점`).join(', ');const low=sorted.slice(-2).map(([k,v])=>`${labels[k]}(${k}) ${v}점`).join(', ');const rows=Object.entries(scores).map(([k,v])=>`<tr><td>${labels[k]}(${k})</td><td>${v}</td><td>${interestLevel(v)}</td></tr>`).join('');return `<h1>${escapeHtml(p.name)} 직업선호도검사 리포트</h1>${baseIntro(p)}<h2>1. 직업선호도검사 결과 요약</h2><div class="summary-box"><p><strong>흥미코드:</strong> ${interestCode(scores)}</p><p><strong>상위 유형:</strong> ${top}</p><p><strong>낮은 유형:</strong> ${low}</p></div><h2>2. 흥미의 육각형 모형</h2>${hexChart(scores)}<p>육각형이 한쪽으로 뚜렷하게 치우치면 특정 분야에 대한 관심이 비교적 분명한 편이고, 정육각형에 가까우면 여러 분야에 고르게 관심을 보일 수 있습니다. 육각형의 전체 크기가 작으면 직업 탐색 경험을 더 넓히는 상담이 필요합니다.</p><h2>3. 입력 점수표</h2><div class="table-wrap"><table><thead><tr><th>지표</th><th>표준점수</th><th>해석</th></tr></thead><tbody>${rows}</tbody></table></div><h2>4. 종합 해석</h2><p>직업선호도검사는 좋아하는 활동, 관심 있는 직업, 선호 분야를 탐색하여 흥미유형에 적합한 직업을 참고하도록 돕는 검사입니다. 다만 현재 보유 능력, 자격, 학력, 가치관을 모두 반영하는 것은 아니므로 상담에서는 경력·자격·근무조건을 함께 고려해야 합니다.</p><h2>5. 관심 직업 2개와 결과의 연결</h2><ul><li><strong>${escapeHtml(job1)}:</strong> 상위 선호 유형과 연결되는 업무활동을 중심으로 적합성을 검토합니다.</li><li><strong>${escapeHtml(job2)}:</strong> 직업명만 보고 판단하지 말고, 실제 업무가 사람 중심인지, 데이터 중심인지, 실행 중심인지 분석해야 합니다.</li></ul><h2>6. 상담 포인트</h2><ul><li>검사결과를 직업명으로 바로 연결하지 말고 업무활동 단위로 해석합니다.</li><li>관심 직업 2개를 실제 채용공고와 비교해 현실성을 점검합니다.</li><li>흥미, 경력, 자격, 근무조건이 만나는 지점을 찾아 자기소개서 소재로 전환합니다.</li></ul><h2>7. 참여자 전달용 요약</h2><p>이번 결과는 앞으로 어떤 직업을 선택해야 하는지를 단정하기보다, 어떤 방식으로 일할 때 더 몰입할 수 있는지를 보여줍니다. 관심 직업인 ${escapeHtml(job1)}, ${escapeHtml(job2)}를 실제 업무내용과 비교하면서 본인에게 맞는 세부 직무를 좁혀가는 것이 좋습니다.</p>`}
function interviewReport(p,job,type,level,situation,req){return `<h1>${escapeHtml(job)} ${escapeHtml(type)} 답변 가이드</h1>${baseIntro(p)}<h2>1. 시뮬레이션 조건</h2><div class="summary-box"><p><strong>지원 직무:</strong> ${escapeHtml(job)}</p><p><strong>면접 유형:</strong> ${escapeHtml(type)}</p><p><strong>난이도:</strong> ${escapeHtml(level)}</p><p><strong>상황:</strong> ${escapeHtml(situation)}</p>${req?`<p><strong>특별 요청:</strong> ${escapeHtml(req)}</p>`:''}</div><h2>2. 예상 질문</h2><ul><li>${escapeHtml(situation)}이 발생했을 때 어떤 순서로 문제를 해결하시겠습니까?</li><li>이 상황에서 가장 먼저 확인해야 할 정보는 무엇입니까?</li><li>이해관계자 간 의견이 다를 때 어떻게 조율하시겠습니까?</li><li>비슷한 경험이 있다면 본인의 역할과 결과를 설명해 주세요.</li></ul><h2>3. 질문 의도</h2><p>면접관은 지원자가 문제 상황을 구조적으로 파악하는지, 우선순위를 판단하는지, 협업과 실행을 통해 결과를 만드는지 확인하려고 합니다.</p><h2>4. 답변 구조</h2><div class="summary-box"><p><strong>S 상황:</strong> 어떤 문제가 있었는지 간단히 설명합니다.</p><p><strong>T 과제:</strong> 본인이 해결해야 했던 역할과 목표를 말합니다.</p><p><strong>A 행동:</strong> 확인한 정보, 조율 방식, 실행한 행동을 구체적으로 말합니다.</p><p><strong>R 결과:</strong> 수치, 변화, 배운 점으로 마무리합니다.</p></div><h2>5. STAR 방식 모범 답변 예시</h2><p>“저는 먼저 상황을 감정적으로 판단하기보다 원인과 영향을 구분해 확인하겠습니다. ${escapeHtml(job)} 직무에서는 일정, 고객, 내부 협업 부서에 미치는 영향을 빠르게 파악하는 것이 중요하다고 생각합니다. 이후 관련자에게 현재 상황을 공유하고 우선순위에 따라 단기 조치와 재발 방지 방안을 나누어 실행하겠습니다.”</p><h2>6. 피해야 할 답변</h2><ul><li>상사에게 바로 보고하겠다는 말만 하고 본인의 판단이 보이지 않는 답변</li><li>열심히 하겠다는 추상적 표현</li><li>특정 사람의 잘못으로만 설명하는 답변</li></ul><h2>7. 추가 꼬리질문</h2><ul><li>그 판단이 틀렸다면 어떻게 수정하시겠습니까?</li><li>성과가 좋지 않았던 경험도 있습니까?</li><li>상사와 의견이 다를 때는 어떻게 설득하시겠습니까?</li></ul><h2>8. 1분 답변 버전</h2><p>“저는 문제 상황이 생기면 원인, 영향, 우선순위를 먼저 나누어 확인합니다. 이후 관련자에게 상황을 공유하고 단기 조치와 재발 방지 방안을 구분해 실행합니다. 특히 ${escapeHtml(job)} 직무에서는 정확한 정보 공유와 협업 조율이 중요하다고 생각합니다.”</p><h2>9. 상담사 코멘트</h2><p>참여자의 실제 경험을 한 가지 선택해 위 구조에 맞게 재작성하면 면접 답변의 설득력이 높아집니다.</p>`}function seniorReport(p,career,assets,direction,req){return `<h1>${escapeHtml(p.name)} 신중년 경력자산 리포트</h1>${baseIntro(p)}<h2>1. 경력 요약</h2><div class="summary-box"><p>${escapeHtml(career).replaceAll('\n','<br>')}</p><p><strong>보유 역량/자격증:</strong> ${escapeHtml(assets||'미입력')}</p><p><strong>희망 방향:</strong> ${escapeHtml(direction)}</p>${req?`<p><strong>특별 요청:</strong> ${escapeHtml(req)}</p>`:''}</div><h2>2. 핵심 경력자산</h2><ul><li>오랜 실무 경험에서 축적된 상황 판단력</li><li>고객, 협력사, 내부 조직과의 관계 관리 경험</li><li>업무 프로세스와 현장 흐름을 이해하는 능력</li><li>예외 상황과 갈등을 처리해 본 문제해결 경험</li></ul><h2>3. 강점 분석</h2><p>신중년 구직자의 강점은 단순 근속기간이 아니라, 반복된 실무 경험을 통해 형성된 안정성, 책임감, 현장 이해도, 관계 조율 능력입니다.</p><h2>4. 전환 가능 직무</h2><ul><li>기존 산업 경험을 활용한 동종업계 실무/관리 직무</li><li>고객응대, 영업관리, 현장관리, 운영지원 직무</li><li>공공·민간 일자리 사업의 상담보조, 행정지원, 모니터링 직무</li><li>경험을 콘텐츠화할 수 있는 강의, 멘토링, 컨설팅 보조 영역</li></ul><h2>5. 추천 진로 방향</h2><p>${escapeHtml(direction)} 방향으로 준비할 경우, 기존 경력을 현재 채용시장에서 이해되는 직무 언어로 바꾸는 과정이 가장 중요합니다.</p><h2>6. 보완 필요 역량</h2><ul><li>기본 문서작성: 한글, 엑셀, 이메일, 보고서 정리</li><li>디지털 업무도구: 채용사이트, 고용24, 온라인 지원, 화상면접</li><li>직무 최신성: 최근 산업 용어, 채용공고 표현, 자격 요건 이해</li></ul><h2>7. 4주 실행 로드맵</h2><ul><li><strong>1주차:</strong> 경력 정리, 희망 직무 3개 선정, 기존 이력서 점검</li><li><strong>2주차:</strong> 채용공고 10개 분석, 반복 키워드 정리, 보완 교육 탐색</li><li><strong>3주차:</strong> 직무별 자기소개 문장 작성, 면접 예상질문 연습</li><li><strong>4주차:</strong> 실제 지원, 상담사 피드백 반영, 지원 결과 관리</li></ul><h2>8. 참여자 전달용 메시지</h2><p>지금까지의 경력은 단순히 과거 이력이 아니라, 다음 일자리를 찾기 위한 중요한 자산입니다. 다만 시장에서 바로 이해될 수 있도록 직책 중심이 아니라 역할, 성과, 문제 해결 경험 중심으로 다시 정리하는 과정이 필요합니다.</p><h2>9. 상담사 코멘트</h2><p>상담사는 참여자의 건강상태, 근무 가능 조건, 희망 수준, 실제 채용시장 상황을 함께 고려하여 최종 추천 직무와 실행계획을 조정합니다.</p>`}

function normalizeSuccessText(text){return String(text||'').toLowerCase().replace(/[()[\]{}·ㆍ,./\\|:;'"‘’“”\-+_]/g,' ').replace(/\s+/g,' ').trim()}
function compactSuccessText(text){return normalizeSuccessText(text).replace(/\s+/g,'')}
function successTokens(text){return normalizeSuccessText(text).split(' ').filter(t=>t.length>=2)}
function addSuccessTerm(terms,term){const value=normalizeSuccessText(term);if(value)terms.add(value);const compact=compactSuccessText(term);if(compact&&compact!==value)terms.add(compact)}
function successUi(key,fallback=''){const assist=successSearchAssist();return assist.ui&&assist.ui[key]?assist.ui[key]:fallback}
function getSuccessQueryTerms(query){const terms=new Set();successTokens(query).forEach(t=>addSuccessTerm(terms,t));addSuccessTerm(terms,query);Object.entries(successRelatedKeywordMap()).forEach(([base,aliases])=>{const safeAliases=Array.isArray(aliases)?aliases:[];const needles=[normalizeSuccessText(base),...safeAliases.map(normalizeSuccessText)].filter(Boolean);const compactNeedles=[compactSuccessText(base),...safeAliases.map(compactSuccessText)].filter(Boolean);const queryCompact=compactSuccessText(query);const matched=compactNeedles.some(v=>queryCompact.includes(v)||v.includes(queryCompact))||successTokens(query).some(token=>needles.some(v=>v.includes(token)||token.includes(v)));if(matched){addSuccessTerm(terms,base);safeAliases.forEach(a=>addSuccessTerm(terms,a))}});return [...terms].filter(t=>t.length>=2)}
function successSearchAssist(){return typeof SUCCESS_CASE_SEARCH_ASSIST==='object'&&SUCCESS_CASE_SEARCH_ASSIST?SUCCESS_CASE_SEARCH_ASSIST:{}}
function successSearchFields(){const assist=successSearchAssist();if(Array.isArray(assist.searchFields)&&assist.searchFields.length)return assist.searchFields;if(typeof SUCCESS_SEARCH_FIELDS==='object'&&Array.isArray(SUCCESS_SEARCH_FIELDS))return SUCCESS_SEARCH_FIELDS;return []}
function successFieldKey(i){return (successSearchFields()[i]||{}).key||''}
function successRelatedKeywordMap(){const legacy=typeof SUCCESS_SIMILAR_KEYWORDS==='object'&&SUCCESS_SIMILAR_KEYWORDS?SUCCESS_SIMILAR_KEYWORDS:{};const assist=successSearchAssist();return {...legacy,...(assist.relatedKeywords||{})}}
function successCaseId(row){return row&&(row[Object.keys(row).find(k=>/ID/i.test(k))]||'')}
function successExtraValue(row,idx){const keys=Object.keys(row||{});return row[keys[idx]]||''}
function successSourceText(row){const field=successUi('sourceField','');return (field&&row&&row[field])||successExtraValue(row,18)||''}
function successFieldScore(value,terms,weight){const text=normalizeSuccessText(value);const compact=compactSuccessText(value);if(!text)return {score:0,terms:[]};let score=0;const matched=[];terms.forEach(term=>{const norm=normalizeSuccessText(term);const c=compactSuccessText(term);if(!norm||!c)return;if(text.includes(norm)||compact.includes(c)){score+=weight;matched.push(term)}else if(norm.length>=3&&text.split(/[\s,./()]+/).some(token=>token&&token.includes(norm))){score+=Math.max(1,Math.floor(weight/2));matched.push(term)}});return {score,terms:matched}}
function successScoreCase(row,query){const terms=getSuccessQueryTerms(query);if(!terms.length)return {score:0,matchedTerms:[],matchedFields:[]};let score=0;const matchedTerms=new Set();const matchedFields=[];successSearchFields().forEach(field=>{const result=successFieldScore(row[field.key],terms,field.weight||1);if(result.score){score+=result.score;matchedFields.push(field.key);result.terms.forEach(t=>matchedTerms.add(t))}});const cq=compactSuccessText(query);const current=compactSuccessText(row[successFieldKey(0)]);if(cq&&current){if(cq===current)score+=30;else if(current.includes(cq)||cq.includes(current))score+=18}const keyword=compactSuccessText(row[successFieldKey(7)]);if(cq&&keyword.includes(cq))score+=12;return {score:Math.min(100,Math.round(score)),matchedTerms:[...matchedTerms],matchedFields:[...new Set(matchedFields)]}}
function findSuccessCases(query,limit=12){return SUCCESS_CASE_DB.map(row=>{const result=successScoreCase(row,query);return {case:row,score:result.score,matchedTerms:result.matchedTerms||[],matchedFields:result.matchedFields||[]}}).filter(x=>x.score>=3).sort((a,b)=>b.score-a.score||String(a.case[successFieldKey(0)]).localeCompare(String(b.case[successFieldKey(0)]),'ko')).slice(0,limit)}
function successSelectedCaseIds(){if(Array.isArray(state.selectedSuccessCaseIds))return state.selectedSuccessCaseIds;return state.selectedSuccessCaseId?[state.selectedSuccessCaseId]:[]}
function collectSelectedSuccessCaseIds(){const checked=[...document.querySelectorAll('input[name="successCaseSelect"]:checked')].map(el=>el.value).filter(Boolean);return checked.length||document.getElementById('successCaseResults')?checked:successSelectedCaseIds()}
function toggleSuccessCaseSelection(id,checked){const ids=new Set(successSelectedCaseIds());if(checked)ids.add(id);else ids.delete(id);state.selectedSuccessCaseIds=[...ids];state.selectedSuccessCaseId=state.selectedSuccessCaseIds[0]||null;const hidden=document.getElementById('successSelectedCaseId');if(hidden)hidden.value=state.selectedSuccessCaseIds.join(',')}
function searchSuccessCases(){const query=val('successJobKeyword');if(!query){toast(successUi('needQuery','Search keyword is required.'));return}const results=findSuccessCases(query,12);state.successQuery=query;state.successResults=results;state.selectedSuccessCaseIds=results[0]?[successCaseId(results[0].case)]:[];state.selectedSuccessCaseId=state.selectedSuccessCaseIds[0]||null;state.successInsight=val('successInsight');render();toast(results.length?`${results.length} matched cases found.`:'No matched cases found.')}
function chooseSuccessCase(id){toggleSuccessCaseSelection(id,!successSelectedCaseIds().includes(id));render()}
function resetSuccessCaseSearch(){state.successQuery='';state.successResults=[];state.selectedSuccessCaseId=null;state.selectedSuccessCaseIds=[];state.successInsight='';render()}
function successCaseResultHtml(){const results=state.successResults||[];const selectedIds=successSelectedCaseIds();if(!results.length)return `<div class="empty">${successUi('emptySearch','Search success cases.')}<br>${successUi('emptySearchSub','Matched cases will appear here.')}</div>`;return `<div class="notice">${successUi('selectionNotice','Select at least one success case. No limit.')}</div><div class="success-search-results">${results.map((item,i)=>{const row=item.case;const id=successCaseId(row);const selected=selectedIds.includes(id);return `<label class="success-result-card ${selected?'selected':''}"><input type="checkbox" name="successCaseSelect" value="${escapeHtml(id)}" ${selected?'checked':''} onchange="toggleSuccessCaseSelection('${escapeHtml(id)}',this.checked)"><span class="success-result-rank">TOP ${i+1}</span><strong>${escapeHtml(row[successFieldKey(0)])}</strong><span>${escapeHtml(row[successFieldKey(1)])}</span><small>${escapeHtml(item.score)} pt - ${escapeHtml((item.matchedFields||[]).join(', ')||'DB')}</small><small>${successUi('sourceLabel','Source')}: ${escapeHtml(successSourceText(row)||'-')}</small></label>`}).join('')}</div>`}
function successFieldRows(row,keys){return keys.map(key=>`<p><strong>${escapeHtml(key)}:</strong> ${escapeHtml(row[key]||'-')}</p>`).join('')}
function successRecommendedPrep(items){const rows=(items||[]).map(item=>item.case||item);const prep=[];if(rows.some(row=>String(row[successFieldKey(2)]||'').trim()))prep.push(successUi('prepCert','Review certificates and licenses found in the casebook.'));if(rows.some(row=>String(row[successFieldKey(3)]||'').trim()))prep.push(successUi('prepProgram','Use public employment, training, and transition support programs as execution steps.'));if(rows.some(row=>String(row[successFieldKey(4)]||'').trim()))prep.push(successUi('prepField','Translate prior management and field activity into job-ready resume language.'));if(!prep.length)prep.push(successUi('prepDefault','Split preparation into certificate, training, field practice, and public support tasks.'));return prep.slice(0,5)}
function successCommonKeywords(items){const counts={};(items||[]).forEach(item=>String((item.case||item)[successFieldKey(7)]||'').split(',').map(v=>v.trim()).filter(Boolean).forEach(v=>{counts[v]=(counts[v]||0)+1}));return Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko')).map(x=>x[0]).slice(0,8)}
function successCaseSummaryHtml(items){return `<div class="success-case-grid">${(items||[]).slice(0,5).map((item,i)=>successCaseCardHtml(item.case||item,item.score||0,i)).join('')}</div>`}
function successSplitValues(value){return String(value||'').split(/[,\/]| and | or |\n/).map(v=>v.replace(/["'()]/g,'').trim()).filter(Boolean)}
function successCountEntries(rows,key){const counts={};rows.forEach(row=>successSplitValues(row[key]).forEach(v=>{counts[v]=(counts[v]||0)+1}));return Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko'))}
function successTopText(rows,key,empty='-'){const entries=successCountEntries(rows,key);return entries.length?entries.slice(0,3).map(([name,count])=>`${name} (${count})`).join(', '):empty}

function successCertGuideRows(keyword,rows){const guide=successSearchAssist().certInfo||{};const queryTerms=getSuccessQueryTerms(keyword).map(compactSuccessText);const fromGuide=Object.entries(guide).filter(([key])=>queryTerms.some(t=>compactSuccessText(key).includes(t)||t.includes(compactSuccessText(key)))).flatMap(([,items])=>items);const dbCerts=successCountEntries(rows,successFieldKey(2)).slice(0,4).map(([name])=>({name,difficulty:successUi('casebook','Casebook'),method:successUi('dbCertMethod','Found in SUCCESS_CASE_DB certificate/training field'),path:successUi('dbCertPath','Compare with job posting requirements and check training schedules'),period:successUi('varies','Varies'),salary:successUi('variesByJob','Varies by job'),outlook:successUi('expandable','Expandable to related jobs')}));const seen=new Set();return [...fromGuide,...dbCerts].filter(item=>{const key=compactSuccessText(item.name);if(!key||seen.has(key))return false;seen.add(key);return true}).slice(0,6)}
function successPatternSentences(rows){const transitions=successCountEntries(rows,successFieldKey(5)).slice(0,3);const jobs=successCountEntries(rows,successFieldKey(0)).slice(0,3);const prep=successRecommendedPrep(rows);const sentences=[];if(transitions.length)sentences.push(`${transitions.map(([n,c])=>`${n} ${c}`).join(', ')}`);if(jobs.length)sentences.push(`${successUi('linkedJobs','Linked jobs')}: ${jobs.map(([n])=>n).join(', ')}`);if(prep.length)sentences.push(prep[0]);return sentences}

function successCaseCardHtml(row,score,index){return `<article class="success-case-card"><div class="success-card-top"><span class="success-rank">TOP ${index+1}</span><span class="success-score">${escapeHtml(score)} pt</span></div><h3>${escapeHtml(row[successFieldKey(0)])}</h3><p class="small"><strong>${successUi('sourceLabel','Source')}:</strong> ${escapeHtml(successSourceText(row)||'-')}</p><div class="success-timeline"><div><b>${successUi('previousCareer','Previous career')}</b><span>${escapeHtml(row[successFieldKey(1)]||'-')}</span></div><div><b>${successUi('preparation','Preparation')}</b><span>${escapeHtml(row[successFieldKey(3)]||'-')}</span></div><div><b>${successUi('currentJob','Current job')}</b><span>${escapeHtml(row[successFieldKey(0)]||'-')}</span></div></div><dl class="success-mini-list"><dt>${successUi('certTraining','Certificate/training')}</dt><dd>${escapeHtml(row[successFieldKey(2)]||'-')}</dd><dt>${successUi('activities','Activities')}</dt><dd>${escapeHtml(row[successFieldKey(4)]||'-')}</dd><dt>${successUi('successFactor','Success factor')}</dt><dd>${escapeHtml(successExtraValue(row,13)||successUi('factorDefault','Connected prior career with preparation and field activity.'))}</dd></dl><details class="success-accordion"><summary>${successUi('openDetail','Open case detail')}</summary><div>${successFieldRows(row,[successFieldKey(1),successFieldKey(3),successFieldKey(2),successFieldKey(4),successFieldKey(6)])}<p><strong>${successUi('sourceLabel','Source')}:</strong> ${escapeHtml(successSourceText(row)||'-')}</p><p><strong>${successUi('counselSentence','Counseling sentence')}:</strong> ${escapeHtml(successExtraValue(row,14)||successUi('sentenceDefault','Use this case as a reference for career asset translation.'))}</p></div></details></article>`}
function successReportHtml(keyword,matchedCases,participant,insight='',selectedRow=null){const items=(matchedCases||[]).filter(Boolean);const rows=items.map(item=>item.case||item).filter(Boolean);if(!rows.length)return `${baseIntro(participant)}<div class="summary-box"><p>No internal matched case for <strong>${escapeHtml(keyword)}</strong>.</p></div>`;const generatedAt=new Date().toLocaleString('ko-KR');const jobs=successTopText(rows,successFieldKey(0));const certs=successTopText(rows,successFieldKey(2));const prep=successRecommendedPrep(rows);const transitions=successTopText(rows,successFieldKey(5));const keywords=successCommonKeywords(items);const certGuide=successCertGuideRows(keyword,rows);return `<div class="success-report"><section class="success-header"><div><p class="success-kicker">${successUi('reportKicker','Public casebook counselor report')}</p><h1>${successUi('reportTitle','Success Case Reemployment Analysis')}</h1><div class="success-header-meta"><span>${successUi('searchJob','Search job')}: ${escapeHtml(keyword)}</span><span>${successUi('similarCases','Similar cases')}: ${escapeHtml(rows.length)}</span><span>${successUi('generatedAt','Generated')}: ${escapeHtml(generatedAt)}</span><span>${successUi('counselorReport','Counselor report')}</span></div></div></section><section class="success-summary-grid"><div class="success-summary-card"><span>${successUi('commonPrep','Common preparation')}</span><strong>${escapeHtml(prep[0]||'-')}</strong></div><div class="success-summary-card"><span>${successUi('commonCerts','Common certificates')}</span><strong>${escapeHtml(certs)}</strong></div><div class="success-summary-card"><span>${successUi('transitionPattern','Transition pattern')}</span><strong>${escapeHtml(transitions)}</strong></div><div class="success-summary-card"><span>${successUi('prepStrategy','Preparation strategy')}</span><strong>${escapeHtml(prep.slice(0,2).join(' '))}</strong></div></section><section class="success-section"><div class="success-section-head"><h2>${successUi('topCases','Representative success cases')}</h2><p>${successUi('topCasesDesc','Top matched cases from SUCCESS_CASE_DB.')}</p></div>${successCaseSummaryHtml(items.slice(0,5))}</section><section class="success-section"><div class="success-section-head"><h2>${successUi('prepAnalysis','Preparation and duration analysis')}</h2><p>${successUi('prepDesc','Checklist from casebook preparation fields.')}</p></div><div class="success-highlight">${escapeHtml(successDurationSummary(rows))}</div><table class="success-cert-table"><thead><tr><th>${successUi('tableItem','Item')}</th><th>${successUi('tableCaseCheck','Casebook check')}</th><th>${successUi('tableCounselUse','Counseling use')}</th></tr></thead><tbody>${successPrepFlags(rows).map(item=>`<tr><td>${escapeHtml(item.label)}</td><td>${escapeHtml(item.value)}</td><td>${successUi('fitCheck','Check feasibility against career, time, cost, and health conditions.')}</td></tr>`).join('')}</tbody></table></section><section class="success-section"><div class="success-section-head"><h2>${successUi('certInfo','Certificate / preparation info')}</h2><p>${successUi('certFallbackDesc','Fallback guidance area.')}</p></div><table class="success-cert-table"><thead><tr><th>${successUi('certName','Name')}</th><th>${successUi('certDifficulty','Difficulty')}</th><th>${successUi('certMethod','Method')}</th><th>${successUi('certPath','Path')}</th><th>${successUi('certPeriod','Period')}</th><th>${successUi('certOutlook','Salary / outlook')}</th></tr></thead><tbody>${certGuide.map(item=>`<tr><td>${escapeHtml(item.name)}</td><td>${escapeHtml(item.difficulty)}</td><td>${escapeHtml(item.method)}</td><td>${escapeHtml(item.path)}</td><td>${escapeHtml(item.period)}</td><td>${escapeHtml(`${item.salary} / ${item.outlook}`)}</td></tr>`).join('')}</tbody></table></section><section class="success-section"><div class="success-section-head"><h2>${successUi('advice','Counseling comments')}</h2><p></p></div><div class="success-advice-box">${successCounselingComments(rows,keyword,insight).map(text=>`<p>${escapeHtml(text).replaceAll('\n','<br>')}</p>`).join('')}</div></section><section class="success-section"><div class="success-section-head"><h2>${successUi('memo','Counseling memo')}</h2><p></p></div><div class="success-highlight"><strong>${successUi('keywords','Keywords')}:</strong> ${escapeHtml(keywords.join(', ')||'-')}</div><ul class="success-question-list"><li>${successUi('q1','Which prior career asset is closest to the representative cases?')}</li><li>${successUi('q2','Which certificate or training can begin within one month?')}</li><li>${successUi('q3','How can prior experience be rewritten in the target job language?')}</li><li>${successUi('q4','Which preparation step has the lowest cost and time burden?')}</li><li>${successUi('q5','Which job postings, training providers, or public support programs should be checked first?')}</li></ul></section></div>`}

function searchJobMatches(){const p=getParticipant();if(!p){toast('참여자를 먼저 선택해주세요.');return}const q=getJobQuery();if(!q.job){toast('희망 직무는 필수 입력사항입니다.');return}const jobs=buildJobCandidates(q,p).map(j=>scoreJob(j,q,p)).sort((a,b)=>b.score-a.score);state.jobResults=jobs;state.lastJobQuery=q;toast('현재 채용공고 기준 매칭 결과를 정리했습니다.');render()}
function buildJobCandidates(q,p){const baseJob=q.job||'직무';const region=q.region||'서울';const type=q.type||'정규직';const career=q.career||'경력무관';const cert=q.cert||'';const pref=q.preference||'';const salary=q.salary||'회사내규';const worktime=q.worktime||'주5일';return[{source:'워크넷/고용24',company:'서울고용서비스센터 협력기관',title:`${baseJob} 상담·행정 지원 담당`,region:region||'서울',career:career,employment:type,salary:salary,worktime:worktime,deadline:'채용시까지',keywords:[baseJob,'상담','행정','고용서비스','문서작성'],requirements:['내담자 응대 및 상담 기록 관리','구직자 취업지원 행정 처리','상담 자료 정리 및 보고서 작성'],preferred:[cert||'직업상담사 자격 우대',pref||'고용서비스 경험 우대','문서작성 가능자']},{source:'사람인',company:'커리어컨설팅 전문기업',title:`${baseJob} 경력 전환 컨설턴트`,region:region||'서울/경기',career:career==='신입'?'1~3년':career,employment:type||'계약직',salary:salary||'면접 후 결정',worktime:worktime||'주5일 09:00~18:00',deadline:'D-14',keywords:[baseJob,'경력상담','전직지원','보고서','커뮤니케이션'],requirements:['참여자 경력진단 및 취업전략 수립','기업·직무 정보 조사','상담 리포트 작성 및 사후관리'],preferred:[cert||'직업상담사·HR 관련 자격 우대',pref||'중장년 상담 경험','프레젠테이션 가능자']},{source:'워크넷/고용24',company:'중장년일자리 지원기관',title:`신중년 ${baseJob} 매칭 전담자`,region:region||'전국',career:career||'경력무관',employment:type||'시간제',salary:salary||'월 230만원 이상',worktime:worktime||'주5일 또는 시간제 협의',deadline:'D-21',keywords:[baseJob,'신중년','일자리매칭','상담','사업운영'],requirements:['신중년 참여자 초기상담','직무별 채용정보 탐색 및 매칭','프로그램 운영 자료 관리'],preferred:[cert||'상담·사회복지·평생교육 관련 자격',pref||'중장년 우대 이해도','공공사업 경험']},{source:'사람인',company:'B2B 교육·HRD 기업',title:`${baseJob} 교육운영 및 기업고객 관리`,region:region||'서울',career:career||'3~5년',employment:type||'정규직',salary:salary||'3,200만원 이상',worktime:worktime||'주5일',deadline:'D-30',keywords:[baseJob,'교육운영','B2B','고객관리','성과관리'],requirements:['기업교육 운영 일정 관리','고객사 커뮤니케이션','교육 만족도 및 결과보고서 작성'],preferred:[cert||'HRD·상담 관련 자격 우대',pref||'B2B 고객응대 경험','엑셀·문서작성 능숙자']},{source:'워크넷/고용24',company:'지역 일자리센터',title:`${baseJob} 취업지원 담당자`,region:region||'지역 선택 가능',career:career||'경력무관',employment:type||'계약직',salary:salary||'기관 내규',worktime:worktime||'주5일',deadline:'채용시까지',keywords:[baseJob,'취업지원','채용정보','구직상담','사후관리'],requirements:['구직자 희망조건 파악','채용공고 탐색 및 알선','입사지원 서류 점검과 사후관리'],preferred:[cert||'직업상담사 우대',pref||'공공기관 사업 이해','운전 가능자 우대']}];}
function scoreJob(job,q,p){let score=55;const hay=(job.title+' '+job.company+' '+job.region+' '+job.career+' '+job.employment+' '+job.salary+' '+job.worktime+' '+job.keywords.join(' ')+' '+job.requirements.join(' ')+' '+job.preferred.join(' ')).toLowerCase();const terms=[q.job,q.region,q.career,q.type,q.cert,q.preference].filter(Boolean).flatMap(x=>String(x).split(/[\s,\/]+/)).filter(x=>x.length>=2);terms.forEach(t=>{if(hay.includes(t.toLowerCase()))score+=7});if((p.career||'').split(/[\s,\/]+/).some(t=>t.length>=2&&hay.includes(t.toLowerCase())))score+=6;if(score>96)score=96;const possibility=score>=85?'상':'중';const gaps=[];if(!q.cert)gaps.push('직무 관련 자격증 또는 교육 이수 여부 확인');if(!q.region)gaps.push('통근 가능 지역 구체화');if(!q.salary)gaps.push('희망 연봉 하한선 정리');if(!q.preference)gaps.push('우대조건과 본인 경험 연결 문장 준비');return{...job,score,possibility,gaps:gaps.slice(0,3),comment:`${escapeHtml(p.name)}님의 기존 경력과 ${escapeHtml(q.job)} 희망 방향을 기준으로 볼 때, 이 공고는 ${score>=85?'우선 검토할 만한 공고입니다':'조건 보완 후 검토할 공고입니다'}. 상담에서는 직무 요구사항 중 본인 경험으로 바로 증명 가능한 항목을 먼저 표시하고, 부족한 요건은 교육·자격·근무조건 조정으로 보완하는 방향이 적합합니다.`}}
function jobResultCards(results){return `<div class="job-results">${results.map((j,i)=>`<div class="job-card"><div class="job-card-head"><div><h4>${i+1}. ${escapeHtml(j.title)}</h4><div class="small">${escapeHtml(j.company)} · 출처: ${escapeHtml(j.source)} · 마감: ${escapeHtml(j.deadline)}</div></div><div class="match-score">${j.score}점<br><span class="small">적합도</span></div></div><div class="job-meta"><span>${escapeHtml(j.region)}</span><span>${escapeHtml(j.career)}</span><span>${escapeHtml(j.employment)}</span><span>${escapeHtml(j.salary)}</span><span>${escapeHtml(j.worktime)}</span></div><div class="match-grid"><div class="match-box"><strong>지원 가능성</strong>${escapeHtml(j.possibility)} · ${j.score>=85?'조건 부합도가 높아 우선 추천':'일부 조건 확인 필요'}</div><div class="match-box"><strong>필요 보완 역량</strong>${j.gaps.map(g=>`- ${escapeHtml(g)}`).join('<br>')}</div><div class="match-box"><strong>상담사 추천 코멘트</strong>${escapeHtml(j.comment)}</div></div><h3>주요 업무</h3><ul>${j.requirements.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul><h3>우대조건</h3><ul>${j.preferred.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul></div>`).join('')}</div>`}

function requiredInterestText(id,label){const text=val(id);if(!text)throw new Error(label+'을(를) 입력해주세요.');return text}

function hasInterestValues(obj){if(!obj||obj==='미입력'||obj==='제공되지 않음')return false;if(typeof obj!=='object')return false;return Object.values(obj).some(v=>typeof v==='object'?hasInterestValues(v):String(v??'').trim()!=='')}
